# Pre-registration sidecar for the AC-39(b)-(e) sensitivity run of sprint C (task
# 260929_notebook-display-design, backlog #5647 C7, part C7a, epic #5648). Spec:
# .praxia/docs/specs/260929_notebook-display-epic.md, task C7 ("Commit 260929_nd_sensitivity_sprint_c.py and its
# sidecar (one outcome each for (b), (c), (d), (e)), then run them through bth run (D17), each negative with its
# own --serve-dir and --out-dir under /tmp/claude-1000/nd-neg/<negative>/ (C8-5)"), D16 ("AC-39 negatives run
# only their own unit"; the harness's --out-dir rule C8-5), D17 ("AC-39 sensitivity runs are pre-registered too",
# C7-8; units, resume, completeness), AC-39 (b), (c), (d), (e), AC-36 (the >= 1600 width predicate), AC-38
# (late_iframe), AC-42.
#
# THIS FILE, scripts/spikes/260929_nd_sensitivity_sprint_c.py and the shared driver
# scripts/negatives/260929_nd_sensitivity.py ARE COMMITTED BEFORE ANY RUN (no run yet). No browser has been
# launched, no dist copied and no `bth run` executed against this driver when this file was written: the
# outcome criteria below were chosen from the spec (and copied in shape from sprints A and B), not from numbers.
# Run it with `bth`, never `uv run bth` (which silently skips sidecar enforcement), from a checkout whose
# web-repl/dist is a FRESH build at the PLR 1.0 pin, unsandboxed (FULL Chromium, SwiftShader):
#
#   bth run --project-slug praxis --output-paths outputs/nd_sensitivity/sprint_c -- \
#     uv run --no-sync python3 scripts/spikes/260929_nd_sensitivity_sprint_c.py \
#       --out-dir outputs/nd_sensitivity/sprint_c --dist web-repl/dist [--resume]
#
# (`bth run` has NO --out option: the driver reads $BTH_RESULTS_PATH, which bathos provides; artifacts are
# declared with --output-paths.) Verify the run by its RECORD, never by exit code (`bth compact` first if it is
# not visible yet):
#   bth sql "SELECT id, status, outcome, exit_code, command FROM runs WHERE id LIKE '<prefix>%'"
#
# The driver writes the flat fields below to $BTH_RESULTS_PATH ONLY when every negative's unit is complete.
# An incomplete run (a timeout or a stampless crash) exits 3 and writes no result, so bathos records no
# outcome, and the next `--resume` run is a new run record.
#
# HOW FOUR NEGATIVES BECOME ONE OUTCOME. bathos evaluates [outcomes] in file order and records the FIRST whose SQL
# holds. The four negatives are independent, so the spec's "one outcome each for (b), (c), (d), (e)" is realised as
# one pre-registered CRITERION each: `<n>_negative_passed` for every negative appears in `all_sensitive`, and each
# negative has its own named failing outcome (`b_insensitive`, `c_hook_found`, `d_insensitive`, `e_insensitive`).
# When several are missed at once the first in b, c, d, e order is the recorded label, but every verdict stays in the
# flat fields (result.json), so none is hidden, and the PR cites all four.
#
# PAIRED CONTROLS (BATHOS.md): the NEGATIVE control is this run itself (each gate must FAIL on what it guards,
# and, for c, the scan must find nothing in the real tree and must find a token planted in a temporary one). The
# POSITIVE control is each unmutated unit passing on the real dist (`repl_smoke.py --dock-check --scenario K1a`,
# `K1b`, `K2`, recorded separately in the sprint C PR): a gate that fails on a broken dist is only sensitive if it
# passes on the good one. Plumbing is proved without a browser by web-repl/tests/test_nd_sensitivity_driver.py
# (a stub harness that fails naming the key, and stubs that pass, fail another key, time out, raise, or whose
# mutation never fired) and by web-repl/tests/test_repl_smoke_resume.py (every derive_* function and the static
# greps, each with a positive control and a negative control per key).

[experiment]
hypothesis = "After sprint C, the dock gates of the --dock-check harness are SENSITIVE to what they guard, and the test-hook grep is clean. Four independent negatives, each pre-registered. (b) AC-34/AC-39(b): the built dist is copied to /tmp/claude-1000/nd-neg/b/dist/ and assets/visualizer3d-augmentations/socket.js is removed from the copy, so the vendored viewer page keeps its real WebSocket, which nothing serves, never receives a scene, and plrViewer.resources() stays empty; the harness unit K1a, run ALONE with its own --out-dir /tmp/claude-1000/nd-neg/b/out/, exits nonzero and names viewer_resources among its FAILING keys (present in the result and not holding). (c) AC-39(c): the static scan grep -rnE '__praxis_test|data-praxis-test' over web-repl/shell/display and web-repl/overlay/assets/visualizer3d-augmentations (*.js, excluding __tests__) finds NOTHING (no test-only hook ships in the product JS). (d) AC-39(d): the negative-only unit N-d, run ALONE, puts the viewer page in a STOCK split-right widget of the harness's own at 1600x900 (an even split, no dock.js sizing) and applies the AC-36 >= 1600 width predicate (panel_width equals max(420, main_area_width - 960 - nb_h_padding) within 8 px), which must report failure: the unit exits nonzero and names panel_width_wide_1600 among its failing keys; the unit may instead record skipped, which passes ONLY where the recorded AC-1 sizing case makes the >= 1600 key recorded-only (repl_smoke.ac39d_status says skipped; today the recorded case is honoured/reachable, so it does not). (e) AC-39(e): the unit K1b, run ALONE with the harness-only --neg drop-query (a context init script that drops every query message the parent page posts on any BroadcastChannel; no product switch), exits nonzero and names late_iframe among its failing keys, and its result proves that at least one query was actually dropped (neg_dropped_queries >= 1). Four ways the run could be misread are excluded by pre-registered validity checks: (1) a harness mutation must really have changed something (b: the pristine dist contained socket.js and the copy lost it); (2) every failure must come from a valid harness stamp whose result carries no error finding, so a harness that timed out (exit 124: no stamp, no result) or whose scenario raised is an instrument failure and never a detection; (3) d's predicate must be shown able to pass (control_formula_passes) and its measurement must be plausible (an even stock split), and e's mutation must be shown to have fired (neg_dropped_queries >= 1); (4) c's scan must have READ dock.js, index.js, socket.js and embed.js and must FIND a token planted in a temporary tree, or a clean result proves nothing. The prior is that every gate is sensitive and the tree is clean, but the prior is NOT a criterion: each negative has a pre-registered failing outcome, and the run is only INVALID (residual) if the instrument itself failed."
stage_name = "exploration"
novel = true

# ---------------------------------------------------------------------------------------------
# [outcomes]: over the flat fields the driver writes when every negative's unit is complete.
# First match wins, in this order. `<n>_negative_passed` is: b, d, e: the harness exited nonzero AND the expected
# key is among its failing keys (d: or, only where recorded-only, recorded skipped), from a valid stamp with no
# error finding; c: the scan found zero matches. measurement_valid is the conjunction, over all four, of the
# per-negative validity checks (see [design.validity]); a harness timeout is nonzero but names no key, so it never
# passes and lands in `invalid`.
# ---------------------------------------------------------------------------------------------

[outcomes.invalid]
condition = "all_units_complete = true AND measurement_valid = false"
decision = "INVALID: a unit carries an error finding, a harness mutation applied to nothing, a harness result carries an error finding, a harness timed out or left no valid stamp for its mutated copy, d's control or e's fired-check failed, or c's scan read none of the required files or could not find a planted token. Fix the driver or the environment, commit, and re-run under this sidecar's design; cite no sensitivity verdict from this run."
reasoning = "A verdict that could be an instrument bug is never reported without a valid measurement (BATHOS.md)."
is_residual = true

[outcomes.all_sensitive]
condition = "all_units_complete = true AND measurement_valid = true AND b_negative_passed = true AND c_negative_passed = true AND d_negative_passed = true AND e_negative_passed = true"
decision = "AC-39(b), (c), (d) and (e) pass for sprint C. Cite this run id in the sprint C PR description with the observed harness exits (b_harness_exit, d_harness_exit, e_harness_exit; c_harness_exit is grep's own status, 1 = nothing found), the unmutated K1a, K1b and K2 units' passing records on the sprint C dist, and whether d ran or was skipped (d_skipped)."
reasoning = "Every harness negative exited nonzero naming its expected key from a valid stamp, with its mutation demonstrably applied (b, e) or its control shown able to pass (d), and the test-hook grep found nothing with a scan shown able to find one."
is_residual = false

[outcomes.b_insensitive]
condition = "all_units_complete = true AND measurement_valid = true AND b_negative_passed = false"
decision = "AC-39(b) FAILS for sprint C: with socket.js removed the K1a unit did not exit nonzero naming viewer_resources (b_harness_exit and b_failing_keys in result.json say which). The gate cannot see the socket shim being absent. Do NOT merge sprint C: fix how K1a reads viewer_resources (it must come from plrViewer.resources() in the iframe), re-run K1a on the real dist, and re-run this driver under this sidecar's design. The other three verdicts are in the flat fields; cite all four."
reasoning = "The mutation was applied and the harness ran validly, so a pass or a failure on some other key is a real finding about the gate's sensitivity, not an instrument fault."
is_residual = false

[outcomes.c_hook_found]
condition = "all_units_complete = true AND measurement_valid = true AND b_negative_passed = true AND c_negative_passed = false"
decision = "AC-39(c) FAILS for sprint C: the scan found a test-only hook (c_match_count matches; failing_keys in units/c.json names each path:line). Remove it from the product JS (a *.test.js next to a source file is scanned too: build the expression from pieces, as dock.test.js does), re-run, and cite the clean run. The other verdicts are in the flat fields."
reasoning = "The scan read every required file and found a planted token in its control, so a match is a real hook in the tree."
is_residual = false

[outcomes.d_insensitive]
condition = "all_units_complete = true AND measurement_valid = true AND b_negative_passed = true AND c_negative_passed = true AND d_negative_passed = false"
decision = "AC-39(d) FAILS for sprint C: on a stock split-right widget the AC-36 >= 1600 width predicate did not report failure (d_harness_exit, d_failing_keys, d_skipped in result.json), or N-d recorded skipped where the recorded sizing case asserts the key. The predicate cannot tell dock.js sizing from an even split. Do NOT merge sprint C: fix the predicate or the N-d measurement, re-run the K2 and N-d units, and re-run this driver."
reasoning = "The predicate's control passed and the measurement was a plausible even split, so the predicate not failing is a finding about AC-36's >= 1600 key."
is_residual = false

[outcomes.e_insensitive]
condition = "all_units_complete = true AND measurement_valid = true AND b_negative_passed = true AND c_negative_passed = true AND d_negative_passed = true AND e_negative_passed = false"
decision = "AC-39(e) FAILS for sprint C: with every query dropped the K1b unit did not exit nonzero naming late_iframe (e_harness_exit, e_failing_keys in result.json; e_dropped_queries proves the queries were dropped). late_iframe does not depend on the query path it claims to guard. Do NOT merge sprint C: fix late_iframe's ordering reads (the query must be observed after the reopen and before the answering announce), re-run K1b, and re-run this driver."
reasoning = "The mutation demonstrably fired (queries were dropped) and the harness ran validly, so late_iframe still passing is a real finding about the gate."
is_residual = false

