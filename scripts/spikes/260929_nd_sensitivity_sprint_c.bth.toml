# ---------------------------------------------------------------------------------------------
# D17 design statement: pre-registered here, committed before the first run.
# ---------------------------------------------------------------------------------------------

[design]
spec = ".praxia/docs/specs/260929_notebook-display-epic.md task C7, D16, D17 (AC-39 sensitivity runs), AC-39 (b)-(e), AC-36, AC-38, AC-42"
driver = "scripts/negatives/260929_nd_sensitivity.py (shared, argparse + logging), entered through scripts/spikes/260929_nd_sensitivity_sprint_c.py (this sidecar's script; fixes the negative set to b, c, d, e and the sprint to c, so the default records go to outputs/nd_sensitivity/sprint_c and never overwrite sprint A's or B's); loads scripts/repl_smoke.py and scripts/unit_runner.py by path"
driver_unit_runner = "scripts/unit_runner.py: every unit (each negative's own and the harness unit it starts) is started and killed through unit_runner.run_unit / kill_tree / Watchdog; nothing else in the driver starts or kills a process"
unit_list = ["b", "c", "d", "e"]
statement = "One unit per negative, in the order b, c, d, e. The driver starts each as its own subprocess (<entry script> --unit <n> --out-dir <dir> --dist <pristine> --neg-root <root> --base-path <bp> --source-root <tree> --chrome-path <path>) through unit_runner.run_unit with timeout = its unit timeout + 60 s (see [design.timeouts]). A unit calls unit_runner.ensure_token(), arms a unit_runner.Watchdog at its unit timeout as its first act, then deletes its own stamp, artifact and timeout marker. For a harness negative (b, d, e) it copies the PRISTINE dist to /tmp/claude-1000/nd-neg/<n>/dist/ (a fresh copy every time; nothing outside that directory is ever written or deleted), applies its mutation (b removes assets/visualizer3d-augmentations/socket.js; d and e remove nothing: their mutation is inside the harness), asserts the copy's dist_hash equals the one predicted from the pristine tree minus the mutation target, deletes the harness unit's own earlier files under /tmp/claude-1000/nd-neg/<n>/out/, and runs ONLY its own harness unit (repl_smoke.py --dock-check --scenario <unit> --serve-dir /tmp/claude-1000/nd-neg/<n>/dist --out-dir /tmp/claude-1000/nd-neg/<n>/out --base-path /praxis/ --chrome-path <path>, plus --neg drop-query for e) as a subprocess through unit_runner.run_unit with timeout = the harness unit's D16 budget + 60 s (the harness's own --scenario watchdog fires at the budget). It reads the harness stamp: valid only if it exists, its inputs equal the inputs the mutated copy implies (the dist input is the mutated copy's hash; the args input includes --neg) and its result_sha256 matches the result on disk; the stamp governs even if run_unit timed out over it (logged with logging.warning); a harness unit with no stamp is a timeout (harness_exit 124) and names no key. Negative c (a grep) starts no harness and copies no dist: it runs the static scan repl_smoke.ac39c_hits over the source tree given by --source-root (default this checkout). Each unit writes <out>/units/<n>.json with unit_runner.write_atomic under the watchdog lock, runs the bounded teardown (kill_tree over residual descendants, output flushed), commits <out>/units/<n>.stamp.json last through Watchdog.commit, and then calls only os._exit(stamp.exit). There is no whole-run timeout. Outcomes are evaluated over the full unit set regardless of reuse: the driver writes its result to $BTH_RESULTS_PATH (and so bathos evaluates [outcomes]) only when every unit is complete, reused or recomputed; a run with an incomplete unit writes no outcome and exits 3. Records go to outputs/nd_sensitivity/sprint_c; the run is launched with `bth run --project-slug praxis` (C7, the sprint C PR cites its record)."
stamp = "{unit, inputs: {name: sha256}, artifact_sha256, started, finished, exit, timeout_s}; exit is 0 only if the driver code did not raise and every pre-registered field is present (a MISSED negative, outcome false, is still exit 0: it is a finding, not a crash)."
hashed_inputs = ["script (the shared driver scripts/negatives/260929_nd_sensitivity.py)", "entry (this sidecar's script)", "runner (scripts/unit_runner.py)", "harness (scripts/repl_smoke.py, loaded by path)", "dist_pristine (unit_runner.dist_hash of the pristine dist)", "dist_mutated (the dist_hash of the mutated copy, predicted from the pristine tree minus the mutation target and asserted equal to the real copy's before the harness runs; equal to dist_pristine for d and e)", "chrome (resolved path + chrome --version)", "driver (unit_runner.driver_input: Playwright version + uv.lock sha256)", "args (negative, harness unit and flag, --neg flags, mutation target, base path, negative root, kind; an addition to the D17 list, strictly more conservative)", "sources (negative c only: the path and sha256 of every file the scan reads, under --source-root; so a changed source recomputes c)"]
resume_rule = "--resume skips a negative only if its stamp exists, stamp.exit == 0, stamp.inputs equal the current inputs, stamp.artifact_sha256 equals the sha256 of the artifact on disk, the artifact has no error finding, every pre-registered field (below) is present, and its recorded outcome passed. Anything else is recomputed: a missed negative (outcome false) is always rerun."
completeness = "A negative's unit is complete when its artifact and a matching stamp (inputs equal the current inputs, artifact_sha256 equal to the artifact on disk) exist. A driver that raises is caught, recorded in the artifact as an error finding {type, message, traceback_tail <= 4 KiB} with harness_exit null, failing_keys [] and outcome false, and the unit still writes its artifact and stamp: it is complete, counts as a failed outcome (measurement_valid false, so `invalid`) and is never reused. Only a timeout (exit 124, no stamp, no artifact, a timeout marker) or a stampless crash makes a unit incomplete. If the driver's run_unit times out over a valid stamp, the stamp governs and a warning is logged."
teardown_order = "1 write artifact through Watchdog.write_result; 2 kill_tree over residual descendants of the unit (it holds no browser: the harness unit closed its own); 3 flush stdout/stderr/logging; 4 Watchdog.commit(stamp); then only os._exit(stamp.exit). A hang in 1-3 is a timeout."
reads = "A harness negative's outcome is read from the harness unit's stamp (exit) and result file (failing_keys, error, skipped, the result checks), written by repl_smoke.py's run_scenario; never from printed console text. Negative c's outcome is read from the scan's own return value."

[design.timeouts]
whole_run_timeout = "none"
note = "D16 budgets: K1a 10 min, N-d 6 min, K1b 14 min; each harness run_unit timeout is the budget + 60 s; a negative unit adds an estimated 180 s for copying and hashing the dist (hundreds of MB) and teardown (c copies nothing, so it gets the allowance alone); the driver kills a unit at its timeout + 60 s. Estimates from the spec, not measurements; the first real run records wall times in result.json for the D16 first-run rule."

[design.timeouts.harness_unit_s]
b = 600
c = 0
d = 360
e = 840

[design.timeouts.negative_unit_s]
b = 840
c = 240
d = 600
e = 1080

[design.timeouts.driver_kill_s]
b = 900
c = 300
d = 660
e = 1140

[design.units.b]
timeout_s = 840
harness_flag = "--dock-check"
harness_unit = "K1a"
expected_key = "viewer_resources"
required_fields = ["harness_exit", "failing_keys", "outcome"]
mutation = "remove assets/visualizer3d-augmentations/socket.js from /tmp/claude-1000/nd-neg/b/dist/, a fresh copy of the pristine dist; the harness is served that copy (--serve-dir /tmp/claude-1000/nd-neg/b/dist/) with its own --out-dir /tmp/claude-1000/nd-neg/b/out/"
description = "outcome is true iff the harness stamp is valid, harness_exit is nonzero, viewer_resources is among failing_keys (present in the harness result and not holding; an absent key of a scenario that raised does not count) and the harness result carries no error finding. K1a is written to name the key rather than raise when the viewer never gets a scene. A harness timeout (exit 124, no stamp, and no result file because the watchdog deletes it under the lock) is nonzero but names no key, so it never passes."

[design.units.c]
timeout_s = 240
kind = "grep"
harness_unit = ""
expected_key = ""
required_fields = ["harness_exit", "failing_keys", "outcome"]
mutation = "none: a static scan, no browser and no dist copy. grep -rnE '__praxis_test|data-praxis-test' web-repl/shell/display web-repl/overlay/assets/visualizer3d-augmentations --include='*.js' --exclude-dir=__tests__, in Python (repl_smoke.ac39c_hits), over the source tree --source-root"
description = "outcome is true iff the scan finds zero matches. harness_exit is grep's own status (1 = nothing found = pass; 0 = matches); failing_keys lists each match as path:line. A *.test.js next to a source file is scanned (only the directory __tests__ is excluded, as the spec's grep)."

[design.units.d]
timeout_s = 600
harness_flag = "--dock-check"
harness_unit = "N-d"
expected_key = "panel_width_wide_1600"
required_fields = ["harness_exit", "failing_keys", "outcome"]
mutation = "none to /tmp/claude-1000/nd-neg/d/dist/ (a whole copy of the pristine dist is served with its own --out-dir /tmp/claude-1000/nd-neg/d/out/); the mutation is inside the harness unit: a stock split-right widget of its own holds the viewer page, no dock.js sizing"
description = "outcome is true iff the harness stamp is valid, harness_exit is nonzero, panel_width_wide_1600 is among failing_keys and the result carries no error finding; OR the harness recorded skipped with exit 0, a valid stamp and no error finding AND repl_smoke.ac39d_status(SIZING_STATUS) is skipped (the >= 1600 key is recorded-only in the recorded D6 sizing case). A skip where the key is asserted is a failed negative (d_insensitive), never a pass. An N-d measurement that is missing or not an even split raises inside the unit (an error finding): never a detection."

[design.units.e]
timeout_s = 1080
harness_flag = "--dock-check"
harness_unit = "K1b"
harness_neg = ["drop-query"]
expected_key = "late_iframe"
required_fields = ["harness_exit", "failing_keys", "outcome"]
mutation = "none to /tmp/claude-1000/nd-neg/e/dist/ (a whole copy of the pristine dist is served with its own --out-dir /tmp/claude-1000/nd-neg/e/out/); the mutation is the harness-only --neg drop-query: a parent-frame context init script drops every query message posted on any BroadcastChannel and counts them (neg_dropped_queries)"
description = "outcome is true iff the harness stamp is valid (its args input includes --neg drop-query), harness_exit is nonzero, late_iframe is among failing_keys and the result carries no error finding. K1b keeps running after late_iframe fails (it re-docks, recorded under evidence.recoveries), so the later keys are still measured."

[design.validity]
harness_negatives = "no error finding in the unit; a valid harness stamp; a harness result with no error finding; pristine_has_target and mutated_lacks_target (b: the pristine dist contained socket.js and the copy lost it; d and e have no target, so both are true by construction); the harness did not time out (exit 124)"
d = "control_formula_passes is true in the harness result (the same >= 1600 predicate passes on the width the formula gives, so it CAN pass) unless the unit recorded skipped; an implausible stock-split measurement raises inside the unit"
e = "neg_dropped_queries >= 1 in the harness result: the drop-query init script demonstrably fired, so late_iframe failing is not an unrelated failure"
c = "scan_covers_required_files (the scan read web-repl/shell/display/dock.js, index.js and visualizer3d-augmentations/socket.js, embed.js) and scan_control_finds_planted_token (the same scan over a temporary tree with a planted token finds it); a missing source tree raises (an error finding)"
any_negative_invalid = "measurement_valid is the conjunction over all four, so one invalid negative makes the whole run `invalid` and no verdict is cited from it"

[design.controls]
negative = "This run: each harness unit on its mutated dist must FAIL naming its expected key (b: viewer_resources; d: panel_width_wide_1600; e: late_iframe), and c's scan must find nothing. Plumbing negative controls (web-repl/tests/test_nd_sensitivity_driver.py): a stub harness that passes, one that fails a different key, one that times out, and one whose scenario raised must each NOT pass a negative's outcome; a mutation whose target is absent, a drop-query that never fired, a d control that cannot pass and a blind or vacuous scan must each invalidate the measurement; a planted test hook must fail c."
positive = "The unmutated K1a, K1b and K2 units passing on the real sprint C dist (AC-34 to AC-38), recorded in the sprint C PR: without them 'the harness fails on a broken dist' could mean the harness fails on everything. Plumbing positive controls: a stub harness that fails naming the expected key passes each harness negative; every derive_* function in scripts/repl_smoke.py has a positive control (raw evidence that must pass) in web-repl/tests/test_repl_smoke_resume.py; c's scan passes on the real tree (the literal AC-39(c) grep exits 1 on it)."
plumbing = "web-repl/tests/test_nd_sensitivity_driver.py exercises driver, unit, stamp, resume, completeness and outcome gating against a stub harness, with no browser, and the sprint C entry end to end; web-repl/tests/test_repl_smoke_resume.py tests the dock units' pure logic, scripted-fake scenario order, the static greps and the in-page init scripts (under bun where available)"
