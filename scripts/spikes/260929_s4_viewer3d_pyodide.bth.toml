# ---------------------------------------------------------------------------------------
# D17 design statement: pre-registered here, committed before the first run.
# ---------------------------------------------------------------------------------------

[design]
spec = ".praxia/docs/specs/260929_notebook-display-epic.md D1 (S4 row), D11, D16, D17, C1, AC-29, AC-30, AC-42"
driver = "scripts/spikes/260929_s4_viewer3d_pyodide.py (argparse + logging); shared runner scripts/unit_runner.py; launch pattern and ServedDir/chromium_launch_args/resolve_chrome_path/_open_existing_notebook from scripts/repl_smoke.py, loaded by path. The plumbing is duplicated from the S3 driver on purpose (the spikes stay independent; no shared spike module; no committed spike file is modified)."
unit_list = ["viewer3d_pyodide"]
statement = "S4 is ONE declared bounded unit, viewer3d_pyodide: the stub-free imports (the pin's pylabrobot.visualizer3D from the dist's PLR wheel, nothing staged), gethostname, the WebLoop checks, the construction and start of the Viewer3D subclass stub, the scene bytes and whether any model carries mesh, both PACKAGE_ROOTs, the first _models_on_disk walk time on each root, the seeded-glb control and the negative control share one kernel, so they are one unit. It runs in its own subprocess (<script> --unit viewer3d_pyodide --out-dir <dir>) and its own browser context, started by the driver through unit_runner.run_unit with timeout = 10 min (600 s) + 60 s = 660 s, and self-bounded by a unit_runner.Watchdog armed at 10 min (600 s) as its first act after ensure_token(). The unit then deletes its own stamp, artifact and timeout marker, probes, writes <out>/units/viewer3d_pyodide.json with unit_runner.write_atomic under the watchdog lock, runs the bounded teardown (browser and Playwright closed, kill_tree over residual descendants, output flushed), commits <out>/units/viewer3d_pyodide.stamp.json last through Watchdog.commit, and then calls only os._exit(stamp.exit). There is no whole-run timeout. Outcomes are evaluated over the FULL unit set regardless of reuse: the driver writes its result (and so bathos evaluates [outcomes]) only when the unit is complete, reused or recomputed; a run with an incomplete unit writes no outcome and exits 3. The probe itself stops starting new work at 540 s (0.9 x the budget) so that an artifact saying how far it got is written before the watchdog can fire; a hit deadline or an aborted step is recorded and makes the run invalid."
stamp = "{unit, inputs: {name: sha256}, artifact_sha256, started, finished, exit, timeout_s}; exit is 0 only if the probe did not raise (no unit-level error, no sub-probe error) and every pre-registered field is present."
hashed_inputs = ["script (this driver, which also holds every kernel cell source)", "runner (scripts/unit_runner.py)", "harness (scripts/repl_smoke.py, loaded by path by the driver and the --unit branch)", "dist (unit_runner.dist_hash of the served dist; it covers the PLR wheel that carries pylabrobot.visualizer3D, Revision 10)", "fixture (the sha256 of the canonical JSON of the seeded notebook, built in the driver from the kernel cell sources: the probe's kernel code; no separate fixture file)", "chrome (resolved path + chrome --version)", "driver (unit_runner.driver_input: Playwright version + uv.lock sha256)", "args (unit, viewport 1440x900, base path; an addition to the D17 list, strictly more conservative)"]
resume_rule = "--resume skips the unit only if its stamp exists, stamp.exit == 0, stamp.inputs equal the current inputs (each of script, runner, harness, dist, fixture, chrome, driver, args), stamp.artifact_sha256 equals the sha256 of the artifact on disk, the artifact has no error finding, and every field pre-registered for the unit (below) is present. Anything else is recomputed. Reuse changes how the work is scheduled, never the [outcomes] criteria; the research note records reused or recomputed, and for a reused unit its source path, input sha256s and artifact sha256."
completeness = "The unit is complete when its artifact and a matching stamp (inputs equal the current inputs, artifact_sha256 equal to the artifact on disk) exist. A probe that raises, at the unit level or inside one sub-probe (a sub-probe is caught; the first sub-probe error is lifted into the unit's error), is recorded in the artifact as an error finding {type, message, traceback_tail <= 4 KiB} (a sub-probe error also names the sub_probe, and every sub-probe error is kept in sub_errors), and the unit still writes its artifact and stamp: it is complete, the error finding counts toward [outcomes] (an error never satisfies a branch outcome: measurement_valid is false and the outcome is `invalid`; a negative control that errors has NOT failed as required), and it is never reused. Only a timeout (exit 124, no stamp, no artifact, a timeout marker) or a stampless crash makes the unit incomplete. If the driver's run_unit times out over a valid stamp, the stamp governs and the driver logs a warning."
teardown_order = "1 write artifact; 2 close browser and Playwright (errors logged, keys unchanged); 3 kill_tree over residual descendants; 4 flush stdout/stderr/logging; 5 Watchdog.commit(stamp); then only os._exit(stamp.exit). A hang in 1-4 is a timeout."
reads = "Every result is read from the NOTEBOOK MODEL (notebook.content.model.cells: each cell's outputs and execution_count as JSON), never from the DOM, the console or printed text. Kernel-side observations are echoed as structured display_data bundles (application/json, raw, metadata.s4 = tag) and read from the same model; a printed stream (the viewer prints its hello line) is never a measurement."
kernel_and_plr = "The kernel is the Pyodide kernel of the served dist. It boots PLR through PYTHONSTARTUP and gates every cell on that boot, so the wait for kernel idle (up to 240 s) and the warm-up cell (up to 180 s) may use much of the budget. The probe imports pylabrobot.visualizer3D from the installed PLR wheel and stages nothing. If the kernel does not reach idle, or the warm-up cell raises, the artifact records kernel_ready / boot.warmup_error and aborted, every later field is null, and the outcome is `invalid`. If find_spec('pylabrobot.visualizer3D') is None (a dist not at the pin, e.g. PLR 0.2.2) the probe records the PLR version, sha and build id it saw, sets aborted = visualizer3d_absent, skips every later cell, and the outcome is `invalid` (no branch claim)."
dist_at_the_pin = "REQUIRED. Only a dist built at the PLR pin (1.0.0b1, 786ac2c4e4f7afe37885af2d98ff5b0afe274c67) contains pylabrobot/visualizer3D. The local web-repl/dist built 260828 (PLR 0.2.2) does not, so a run against it is `invalid` by design, not a finding. The PLR version actually seen is recorded in the artifact (plr.version, plr.source_sha, plr.build_id) and in the flat result (plr_version, plr_source_sha, plr_at_pin, visualizer3d_present)."

[design.timeouts]
unit_s = 600
driver_kill_s = 660
probe_deadline_s = 540
kernel_idle_wait_s = 240
warmup_cell_s = 180
cell_s = 45
heavy_cell_s = 90
whole_run_timeout = "none"
note = "D17 S4 row: 10 min for the one unit; estimates from the spec, not measurements. The internal caps are each clipped to the time left before the deadline. heavy_cell_s applies to imports, viewer_setup, viewer, roots_stock, roots_rebound and seeded."

[design.cells]
notebook = "s4_viewer3d_pyodide.ipynb, seeded through contents.save, opened with the Select Kernel dialog accepted; one code cell per probe cell, nothing pre-executed"
order = "warm, setup, imports, hostname, neg_import, loop, viewer_setup, viewer, roots_stock, roots_rebound, seeded, restore"
execution = "one cell at a time through notebook:run-cell (the run command's promise settling marks the cell done). The viewer cells (viewer_setup .. restore) are run only if the stub-free imports of pylabrobot.visualizer3D and the stdlib names succeeded; otherwise they are skipped and named in `skipped`."
top_level_await = "loop, viewer, roots_stock, roots_rebound and seeded use top-level await (the S3 spike established that await cells run in this kernel)"
fixture_deck = "a Facility (1200 x 800 x 600 mm) with a Hamilton tip carrier holding a 1000 uL tip rack and a plate carrier holding a Corning 96-well plate, built in the kernel; the first scene message is the real inherited Viewer3D._handler output over a virtual connection"

[design.derivations]
plr = "visualizer3d_present from importlib.util.find_spec (no import); at_pin: the build-info sha == the pin, else (sha unreadable) the version starts with 1.0.0b1; null if neither is readable"
imports = "each name is imported with importlib.import_module STUB-FREE and read as a REAL success only if it imported and its module has a spec (a module without one is a bare stub, e.g. a boot stub); stdlib_ok over socket, http.server, webbrowser, threading; websockets_ok over websockets, websockets.asyncio.server, websockets.http11; visualizer3d_ok over pylabrobot.visualizer3D and its scene, facility and server modules; ssl is recorded (info) only. Controls: json imports for real; a bare types.ModuleType reads as stub-like."
gethostname = "gethostname_ok: socket.gethostname() returned a non-empty str; False if it raised; null if unread"
loop = "call_later_supported / call_soon_threadsafe_supported: True if the timer fired within 3 s; False if the attribute is missing or the call raised NotImplementedError/AttributeError; null otherwise (a timer that never fired, another error). Control: a cancelled call_later must not fire (timer_cancel_control_ok)."
viewer = "construct_ok / start_ok: the subclass constructed / start() returned; a raised step is null. start_without_threads: start() ran with Thread.start, websockets.serve and webbrowser.open patched to raise, none of them was called, and each patched function raised when called directly (the control); null if the control did not hold."
scene = "first_scene_message_bytes: utf-8 bytes of the first message the real _handler sent to a virtual client over the rebound root, which must decode to event scene followed by state; mesh_models_rebound / mesh_models_stock: the count of models with a mesh key in the rebound-root handler message / the stock-root scene payload. scene_flush_ok: after assign_child_resource the client receives scene then state, rebuilds == 1 and the epoch advanced by 1 (the loop chain call_soon_threadsafe -> call_later)."
roots_and_walk = "stock_root: server.PACKAGE_ROOT before any rebind, with in_plr_package (== the pylabrobot package directory), in_site_packages and the .glb count under it; rebound_root: the value after the first guarded construction (must exist, be empty and differ from the stock root; a second guard call must leave it unchanged); the walk seconds are the first (cache-missing) _models_on_disk call on each root during the inherited scene build, measured by an instrument wrapper; walk_on_rebound_root asserts the timed walk ran over the rebound root."
seeded_control = "a <model>.glb (the deck's tip-carrier model) seeded into a temporary root must make exactly that model carry a mesh; the previous PACKAGE_ROOT is restored and _models_on_disk is restored in the last cell"
negative_control = "failed_as_required is true iff a stub-free import of EVERY candidate (tkinter, curses; absent from Pyodide) failed with an ImportError that names the candidate; null if unread; a candidate that imported, or a control that errored, has NOT failed as required."
validity_checks = "no_error_findings, kernel_ready, boot_ok, prelude_ok, visualizer3d_present, plr_at_pin, not_aborted, all_cells_done, deadline_not_hit, imports_measured, import_positive_control, stub_detector_control, hostname_measured, negative_control_failed_as_required, loop_measured, timer_cancel_control; and, only when the viewer path can exist (no stdlib failure, call_later not false, visualizer3D imported): viewer_measured, patch_control_ok, start_without_threads_measured, scene_measured, flush_measured, roots_measured, walk_measured (on the rebound root, a cache miss), mesh_counts_measured, seeded_control_sees_mesh, rebind_effective (empty root, different from the stock root). invalid_reason is the first failing check in this order."

[design.controls]
positive = "the warm-up and setup cells prove the kernel executes and the model reader returns kernel-side bundles; json imports for real; the uncancelled timer fires; the seeded .glb yields a mesh; the stock root yields the pin's meshes (the expected natural positive)"
negative = "D17: a stub-free import of a module known absent from Pyodide (tkinter, curses) must fail. A negative control that ERRORS or imports has NOT failed as required."
instrument_can_say_no = "a bare ModuleType reads as a stub, not a real import; a cancelled timer must not fire; each patched function must raise when called directly; the rebound (empty) root must read zero mesh while the seeded root reads one; a viewer step that raised reads null, never False"
plumbing = "web-repl/tests/test_s4_spike_driver.py: driver, unit, stamp, resume (each input incl. harness), completeness and outcome-gating against a stub probe (no browser); the judges and the branch derivation over synthetic artifacts; the sidecar outcomes evaluated by bathos; and the kernel cell sources run in CPython against PLR's own visualizer3D source when importable (a stand-in, not S4 evidence)."

[design.units.viewer3d_pyodide]
timeout_s = 600
