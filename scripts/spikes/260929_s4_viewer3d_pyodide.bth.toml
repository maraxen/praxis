# Pre-registration sidecar for spike S4 (task 260929_notebook-display-design, backlog #5628 C1,
# epic #5648). Spec: .praxia/docs/specs/260929_notebook-display-epic.md, D1 row S4, D11 (the
# docked viewer: pylabrobot.visualizer3D imported from the pin, the Viewer3D subclass, the
# PACKAGE_ROOT rebind through the guarded first-construction helper _ensure_package_root(),
# GATE X), D16 (shared unit runner, bounded teardown), D17 (one bounded unit, resume,
# completeness), Sprint C task C1, AC-29, AC-30, AC-42, and the section 4 rows for the S4 files.
#
# THIS FILE AND scripts/spikes/260929_s4_viewer3d_pyodide.py ARE COMMITTED BEFORE ANY RUN. No
# browser has been launched, no dist built and no `bth run` made against this probe when this
# file was written: the outcome criteria below were chosen from the spec, not from numbers. The
# only executions before the commit are the plumbing tests (web-repl/tests/test_s4_spike_driver.py),
# which run the kernel cell sources in CPython against PLR's own visualizer3D source as a STAND-IN
# for the kernel; they are not S4 evidence (CPython is not Pyodide: no WebLoop, no threads
# restriction, no boot stubs) and no number from them is cited. Run the spike with `bth`, never
# `uv run bth` (which silently skips sidecar enforcement). `bth run` has NO `--out` option; the
# driver hands its result to bathos through $BTH_RESULTS_PATH:
#
#   bth run --project-slug praxis --output-paths outputs/spikes/260929_s4 -- \
#     uv run --no-sync python3 scripts/spikes/260929_s4_viewer3d_pyodide.py \
#       --out-dir outputs/spikes/260929_s4 --dist <dist built at the pin> [--resume]
#
# Verify the run by its RECORD (bth compact first if it is not visible yet):
#   bth sql "SELECT id, status, outcome, exit_code, command FROM runs WHERE id LIKE '<prefix>%'"
#
# DIST REQUIREMENT (a stated limitation): pylabrobot/visualizer3D exists only from the PLR pin,
# 1.0.0b1 (786ac2c4e4f7afe37885af2d98ff5b0afe274c67; Revision 10). The local web-repl/dist built
# 260828 carries PLR 0.2.2 and does NOT contain it, so this spike can only be run against a dist
# built at the pin (from a checkout branched from origin/main with the submodule at the pin; D16
# "Import-time submodule dependency"). Against any other dist the probe FAILS FAST: it reads
# find_spec("pylabrobot.visualizer3D") in the kernel, records the PLR version, sha and build id it
# actually saw, sets aborted = "visualizer3d_absent", skips every later cell, and the outcome is
# `invalid` (never a branch claim). A dist whose PLR is not the pin (sha from
# pylabrobot._praxis_build_info when readable, else the version prefix 1.0.0b1) is `invalid` too.
#
# The driver writes the flat fields below to $BTH_RESULTS_PATH ONLY when the unit is complete.
# An incomplete run (a timeout, a stampless crash) exits 3 and writes no result, so bathos
# records no outcome, and the next `--resume` run is a new run record. A complete run whose
# measurement is invalid still exits 0: its outcome is `invalid`.
#
# READING CHOICES (each is the most conservative reading of the spec; none is a numeric
# criterion):
#  * "Stub-free": every import is importlib.import_module of the real name. A module that is
#    present only as a boot stub (spec is None, e.g. the seven install_native_stubs names) is NOT a
#    real success. The ssl import is recorded but is not a criterion (it is boot-stubbed).
#  * S4-B is claimed only for a failing STDLIB import (socket, http.server, webbrowser,
#    threading) or a failing socket.gethostname(). A failing websockets or pylabrobot.visualizer3D
#    import, even if it is caused by a stub's missing attribute, is UNMAPPED: no D1 branch names
#    it, the run stops and the orchestrator rules (it may rule it S4-B's mechanism, a richer named
#    stub, in a follow-up). Under S4-B the viewer-path measurements cannot exist and are waived
#    (not required); the run lists the stubs required (the failing names) and takes no stubbed retry.
#  * S4-C is claimed only when call_later is missing or raises NotImplementedError/AttributeError.
#    A timer that never fires, or any other error, is inconclusive (null, so `invalid`). S4-C
#    dominates S4-B (a stop).
#  * A raised STEP inside the viewer path (construct, start, handler, hello, flush) is null
#    (inconclusive), never a measured "no": a probe bug and a real failure are indistinguishable
#    there. Only the import attempts and the direct loop-API calls turn an exception into a
#    measured failure.
#  * The "no mesh after the rebind" reading is taken from the FIRST scene message the real
#    inherited _handler sends over the rebound root; mesh_models_rebound must be exactly 0 for S4-A.
#    A nonzero count with everything else working is the MESH outcome (D11's premise is false).
#  * The walk time is read from an instrument wrapper around the module's _models_on_disk during
#    the inherited scene build (the first, cache-missing call on the root); it is valid only if it
#    ran over the rebound root. Timer resolution in the page may be coarse (perf_counter_resolution_s
#    is recorded); the time is recorded, not a criterion.
#  * The fixture deck is a small Facility with a Hamilton tip carrier + rack and a plate carrier +
#    plate, built in the kernel with the pin's public resource API (make_fixture.py's assemble() is
#    sprint B and is not on this branch). Its models match .glb files the pin ships, so the stock
#    root is EXPECTED to yield mesh entries: that is the natural positive control, and a seeded
#    <model>.glb in a temporary root is the independent one.

[experiment]
hypothesis = "In the Pyodide kernel of a served dist built at the PLR pin (1.0.0b1, so its PLR wheel contains pylabrobot/visualizer3D and websockets 17.0.1 is a vendored wheel), inside ONE kernel and reading only the NOTEBOOK MODEL: the pin's pylabrobot.visualizer3D (and its sub-modules scene, facility, server) imports STUB-FREE together with websockets, websockets.asyncio.server, websockets.http11, http.server, webbrowser, threading and socket, and socket.gethostname() returns a name; a Viewer3D subclass stub shaped like D11's DockedViewer3D (overrides __init__, start, stop only; start() synchronous legacy_size, no websockets.serve, no file server, no threads, no browser) constructs and start()s with threading.Thread.start, websockets.serve and webbrowser.open each patched to raise and never called; WebLoop supports call_later and call_soon_threadsafe as the viewer uses them, including the real chain assign_child_resource -> call_soon_threadsafe(_mark_scene_dirty) -> call_later(SCENE_DEBOUNCE_S) -> a rebuilt scene and state message on the virtual client; and, over the rebound PACKAGE_ROOT (D11: one guarded rebind to an empty tempfile.mkdtemp() before the first construction), the fixture deck's first scene message, built by the real inherited _handler, carries no mesh on any model (mesh_models_rebound = 0), where over the STOCK root (inside the installed PLR package, which ships 63 .glb files) it does. The probe records the stock and rebound roots, the bytes of the first scene message, the first _models_on_disk walk time on each root, the stubs required (possibly none) and the PLR version it saw. Each D1 S4 branch is a pre-registered outcome: S4-A all yes; S4-B a stdlib import or gethostname fails (stubs listed); S4-C WebLoop lacks call_later (a stop); plus two the spec does not name and which stop the run: UNMAPPED (something the design-as-written needs fails and no D1 branch names it) and MESH (everything works but the rebind did not remove every mesh). Controls per instrument: a stub-free import of tkinter and of curses, modules known absent from Pyodide, must FAIL (the D17 negative control); json must import for real and a bare ModuleType must read as stub-like; a cancelled call_later must NOT fire while an uncancelled one does; each patched function must raise when called directly; a .glb seeded for a model of the deck into a temporary root must produce a mesh for exactly that model (the mesh reader can say yes). The run is INVALID (residual) if the instrument itself failed (an error finding, pylabrobot.visualizer3D absent from the kernel, a PLR that is not the pin, an uncontrolled or unmeasured verdict, a cell that never settled, the deadline, an aborted boot, or a negative control that did not fail as required). There is no numeric prior recorded: the design is unmeasured in this kernel."
stage_name = "exploration"
novel = true

# ---------------------------------------------------------------------------------------
# [outcomes]: over the flat fields the driver writes when the one unit is complete. Outcomes
# are evaluated in file order (first match) and are mutually exclusive by construction: each
# valid run has exactly one d1_branch, derived by the driver (derive_branch) from the valid
# measured fields: S4-C if call_later_supported is false; else S4-B if a stdlib import or
# gethostname failed; else UNMAPPED if any of websockets_imports_ok, visualizer3d_import_ok,
# construct_ok, start_ok, start_without_threads, call_soon_threadsafe_supported, scene_flush_ok
# is not true or the first scene message was not measured; else MESH if mesh_models_rebound is
# not 0; else S4-A. measurement_valid is the conjunction of the named validity checks (see
# [design.derivations]); when it is false d1_branch is null and only `invalid` matches.
# ---------------------------------------------------------------------------------------

[outcomes.s4_a]
condition = "all_units_complete = true AND measurement_valid = true AND d1_branch = 'S4-A'"
decision = "S4-A: all yes. Design as written (D11: import the pin's pylabrobot.visualizer3D, subclass Viewer3D with __init__/start/stop, rebind PACKAGE_ROOT through _ensure_package_root(), no stubs)."
reasoning = "Every stub-free import worked, gethostname worked, the subclass constructed and started without threads, WebLoop supports call_later and call_soon_threadsafe end to end, and the rebound root removes every mesh."
is_residual = false

[outcomes.s4_b]
condition = "all_units_complete = true AND measurement_valid = true AND d1_branch = 'S4-B'"
decision = "S4-B: a stdlib import or gethostname fails (stubs_required names it). praxis/viz/viewer3d.py installs minimal named stubs into sys.modules BEFORE importing pylabrobot.visualizer3D, the same mechanism stages.install_native_stubs uses; each stub is listed and tested (C3). No PLR file is modified. The viewer-path measurements (construct, start, scene bytes, both roots, the walk time) were not taken behind a failed import and are a follow-up under a new pre-registration with the stubs."
reasoning = "A stdlib name the viewer needs is missing or broken in the kernel; call_later exists, so the design survives with stubs."
is_residual = false

[outcomes.s4_c]
condition = "all_units_complete = true AND measurement_valid = true AND d1_branch = 'S4-C'"
decision = "S4-C: WebLoop lacks call_later. STOP and escalate: making it work needs a fourth override (_mark_scene_dirty), which trips GATE X (D11). The recommended path is to upstream a transport hook to PLR. stubs_required and the other fields are recorded (a stdlib failure alongside is possible and also listed)."
reasoning = "call_later is missing or raises NotImplementedError/AttributeError with the timer instrument controlled."
is_residual = false

[outcomes.s4_mesh]
condition = "all_units_complete = true AND measurement_valid = true AND d1_branch = 'MESH'"
decision = "MESH: everything the design needs works, but the fixture deck's first scene message still carries mesh entries after the PACKAGE_ROOT rebind (mesh_models_rebound is not 0). D11's claim that the rebind alone removes every mesh is FALSE: STOP C3/C4 and escalate (AC-29 and AC-31 cannot assert it); read the recorded mesh model names and the rebound root's listing."
reasoning = "The seeded control saw a mesh (the reader can say yes), so a nonzero count on the rebound root is real."
is_residual = false

[outcomes.s4_unmapped]
condition = "all_units_complete = true AND measurement_valid = true AND d1_branch = 'UNMAPPED'"
decision = "UNMAPPED: a valid measurement in which something the design-as-written needs failed and no D1 branch names it (a websockets or pylabrobot.visualizer3D import failing, construct or start failing, start using a thread, websocket serve or browser, call_soon_threadsafe missing, or the loop-driven rebuild not delivering a scene). STOP and escalate with the recorded failures; the orchestrator rules whether it is S4-B's mechanism (a richer named stub for a stdlib module such as ssl) or a new branch."
reasoning = "The instrument was controlled and the failure is a measured no, but D1 S4 has no branch for it."
is_residual = false

# The residual: the instrument did not produce a valid measurement. Not evidence for any branch.
[outcomes.invalid]
condition = "all_units_complete = true AND measurement_valid = false"
decision = "INVALID: the unit carries an error finding (unit or sub-probe), or pylabrobot.visualizer3D is absent from the served kernel (a dist not built at the pin, for example PLR 0.2.2: aborted = visualizer3d_absent, plr_version recorded), or the PLR is not the pin, or the kernel never reached idle, or the warm-up cell (PLR boot gate) raised, or a cell never settled, or the deadline was hit, or a verdict is unmeasured or uncontrolled (invalid_reason names the first failing check), or the negative control did not fail as required (including one that errored). Fix the probe or the dist, commit, and re-run under this sidecar's design; cite no branch from this run."
reasoning = "A verdict that could be a probe bug or a wrong dist is never reported without a control that proves the instrument can say the opposite."
is_residual = true

