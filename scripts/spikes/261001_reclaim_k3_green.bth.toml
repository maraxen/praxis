k_iframe_reloads_during_reclaim = "bool"
k_reclaim_open_1280 = "bool"

# ---------------------------------------------------------------------------------------------
# Design statement: pre-registered here, committed before the first run.
# ---------------------------------------------------------------------------------------------

[design]
spec = ".praxia/docs/specs/261001_nd-next-5656-deck-layout.md AC-N5 (K3 and its RED/GREEN runs), AC-N1, AC-N7, task T6, N5656-3, N5656-5, N5656-8; epic 260929_notebook-display-epic.md D16, D17"
listed_keys = ["open_loads_once_1440", "reclaim_open_1440", "reclaim_keeps_mid_1440", "reclaim_low_moves_1440", "reclaim_after_high_1440", "reclaim_after_toggle_1440", "reclaim_keeps_current_1440", "reclaim_after_resize_down", "reclaim_after_resize_up", "reclaim_after_tier_entry", "iframe_reloads_during_reclaim", "reclaim_open_1280", "pageerrors"]
runner = "scripts/spikes/261001_reclaim_k3.py (argparse + logging; loads scripts/repl_smoke.py and scripts/unit_runner.py by path), started through scripts/spikes/261001_reclaim_k3_green.py (this sidecar's script, which fixes --phase green)"
harness_unit = "repl_smoke.py --dock-check --scenario K3 --serve-dir <dist> --out-dir <out>/k3 --base-path /praxis/ --chrome-path <path>: ONE unit in ONE process with its own Watchdog at its 10 min D16 budget (an estimate; K2's nine steps took 116.7 s), started through unit_runner.run_unit with timeout = budget + 60 s; nothing else in the runner starts or kills a process"
statement = "One unit, K3. The runner resolves the FULL Chromium, hashes the harness's own inputs for this dist (dist, notebook, harness, runner, chrome, args, driver), checks by INPUT that the served shell/display/dock.js CONTAINS `reclaimMedium`, and either reuses a valid prior unit (--resume) or deletes the unit's stamp, result and timeout marker (stamp first) and starts the harness unit. It reads the unit's stamp and result with the harness's own inspect_unit: valid only if the stamp exists, its inputs equal the current inputs and its result_sha256 matches the result on disk; the stamp governs even if run_unit timed out over it (logged with logging.warning). It then writes <out>/result.json (the aggregate) and, only when the unit is complete, the flat fields to $BTH_RESULTS_PATH. An incomplete unit (exit 124 from the watchdog: no stamp, no result, a timeout marker; or a stampless crash) exits 3 and writes no outcome. There is no whole-run timeout."
resume_rule = "--resume reuses the unit only if its stamp is VALID for the current inputs (every hashed input equal, result_sha256 equal to the file); a valid unit whose keys failed is reused as that verdict (rerun without --resume to measure again, and the new record stands beside the old). Anything else is recomputed. The aggregate records reused, the result path and the stamp's result_sha256 and inputs."
timeouts = "No whole-run timeout. K3's own watchdog: 600 s. run_unit: 660 s. Estimates, not measurements; the first real run records wall times (started and finished in the unit's stamp)."
reads = "The outcome fields are read from the harness unit's stamp and result file (written by repl_smoke.py's run_scenario) and from dist/shell/display/dock.js; never from printed console text."
hashed_inputs = ["dist (unit_runner.dist_hash of the served dist)", "notebook (the display_check.ipynb fixture)", "harness (scripts/repl_smoke.py)", "runner (scripts/unit_runner.py)", "chrome (resolved path + chrome --version)", "args (unit id, base path, the six viewports, --neg flags)", "driver (Playwright version + uv.lock sha256)"]

[design.validity]
build = "build_has_fix = true: the served shell/display/dock.js contains the token reclaimMedium (checked from the file, not from any result)"
instrument = "unit_error_free, keys_present, status_asserted"
not_validity = "the keys, the preconditions, the settle flags and the step errors: after the fix they are findings about the product (see the header)"

[design.controls]
negative = "The RED run of the same unit (scripts/spikes/261001_reclaim_k3_red.bth.toml): the six re-clamp keys are false on the build without the fix. Plumbing negative controls (web-repl/tests/test_repl_smoke_resume.py, test_reclaim_k3_runner.py): a build without the fix, a drag that did nothing, a toggle that did nothing, an ignored viewport change, a layout that never settles, a reload per re-clamp and a drag that raises each make green impossible; a GREEN run on a dist that lacks reclaimMedium is invalid."
positive = "This run: every key true on the fixed build. Plumbing positive control: a scripted page that re-clamps holds all twelve keys, with every precondition and every settle true."
plumbing = "web-repl/tests/test_repl_smoke_resume.py and web-repl/tests/test_reclaim_k3_runner.py, no browser"
