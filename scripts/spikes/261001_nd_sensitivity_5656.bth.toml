# Pre-registration sidecar for N-g, the re-runnable negative of the deck-layout increment (task 260929_notebook-display-design,
# backlog #5656, umbrella #5648). Spec: .praxia/docs/specs/261001_nd-next-5656-deck-layout.md, AC-N6 and task T7 (accepted 2026-10-01,
# decisions Q1-Q8 answered "go with your recommendations"), N5656-8 (control discipline), A5/A7/A8 (the root cause and the recorded numbers).
#
# THIS FILE, scripts/spikes/261001_nd_sensitivity_5656.py (the launcher), scripts/negatives/261001_nd_sensitivity_5656.py (the driver) and
# the N-g unit in scripts/repl_smoke.py ARE COMMITTED BEFORE ANY RUN. No browser has been launched and no `bth run` executed against this
# driver when this file was written; the outcome criteria below were taken from the spec (AC-N6), not from a number of this run. The
# recorded numbers the PRIOR rests on (73.5 px empty at 1440 open, 0 px at 1280 open, 220 px after a drag past 480) come from the
# exploratory K2 run (outputs/repl_smoke/dock-check/result.K2.json, result_sha256 e0176c978f22f9ca9908ce1213308e5ca11e951b611f64b25ff89e05e178b1e2,
# dist ba43b338), which had NO sidecar: that is stated, and this run re-measures the arrangement under one. The prior is not a criterion.
#
# Run it with `bth`, never `uv run bth` (which silently skips sidecar enforcement), from a checkout whose web-repl/dist is a FRESH build,
# unsandboxed (FULL Chromium, SwiftShader):
#
#   bth run --project-slug praxis --output-paths outputs/nd_sensitivity/sprint_5656 -- \
#     uv run --no-sync python3 scripts/spikes/261001_nd_sensitivity_5656.py \
#       --out-dir outputs/nd_sensitivity/sprint_5656 --dist web-repl/dist [--resume]
#
# (`bth run` has NO --out option: the driver reads $BTH_RESULTS_PATH, which bathos provides.) Verify the run by its RECORD, never by exit
# code (`bth compact` first if it is not visible yet):
#   bth sql "SELECT id, status, outcome, exit_code, command FROM runs WHERE id LIKE '<prefix>%'"
#
# N-g runs on the dock being CLOSED (no `dock()` cell, no kernel): the stock widget is the harness's own and dock.js's re-clamp never
# runs, so the run does not depend on the fix and is re-runnable on any later build (its dist hash is an input). It is NOT a CI step and not
# part of the aggregate, like N-d.
#
# PAIRED CONTROLS (BATHOS.md). The NEGATIVE control is this run itself: K3's predicate must FAIL on the stock arrangement. The POSITIVE
# control is INSIDE the unit: the same widget, sized by the harness itself so its half is 480 / A (saveLayout -> sizes -> restoreLayout,
# the path the fix uses), must PASS the predicate in the same page; a predicate that cannot pass would "detect" anything. Plumbing is
# proved without a browser by web-repl/tests/test_nd_sensitivity_5656_driver.py (derive_ng_keys and ng_measurement_problem on the recorded
# arrangement, a sized one, missing rects and a 0.3 / 0.7 config; the driver end to end against a stub harness that fails naming the key,
# passes, or whose control cannot pass).

[experiment]
hypothesis = "A STOCK split-right widget that carries the deck's CSS limits (inline min-width 420 px and max-width 480 px, set before it is added, then parent.fit(), exactly what dock.js does at 1280-1599 px) and has NO dock.js sizing, added beside the notebook at 1440x900 with the file browser open, is laid out by Lumino so that its half is wider than the capped widget and the widget is centred in it: K3's predicate reclaim_ok(snapshot, 480) (real dead space <= 2 px, where real dead space = layout_summary.slack - 2 x (notebook_panel.left - dock_panel.left), and the widget node 480 +- 2 px wide) reports FAILURE on the layout Lumino leaves (the harness unit N-g, run ALONE with its own --out-dir /tmp/claude-1000/nd-neg/g/out/, exits nonzero and names reclaim_ok_stock_capped_1440 among its FAILING keys), while the SAME widget, sized by the harness itself so that its half is 480 / A (A = dock - 2 x inset - handles), passes the same predicate (control_sized_passes = true). This is the sensitivity half of the deck-layout fix's evidence: it shows the new predicate can see the arrangement the fix removes, independently of dock.js. Four ways the run could be misread are excluded by pre-registered validity checks that read INPUTS, never the dead-space output being judged: (1) every rect the predicate reads (dock_panel, notebook_panel, deck_panel) is present and numeric in BOTH snapshots, and the measured left inset (notebook_panel.left - dock_panel.left) lies in [0, 20] px; (2) the stock node's computed min-width and max-width are 420px and 480px, so it really carries the deck's limits; (3) the stock layout config's two split sizes are 0.5 and 0.5 +- 0.01, so the arrangement is the even split a fresh split-right makes; (4) the control passes reclaim_ok(.., 480), so the predicate can pass in this very page. A harness that timed out (exit 124: no stamp, no result) or whose scenario raised (an error finding, including any failed check above) is an instrument failure and never a detection. The prior is that the predicate is sensitive (the exploratory K2 run recorded 73.5 px at 1440 open), but the prior is NOT a criterion: g_not_detected is a pre-registered outcome and would be a finding about Lumino, not a pass."
stage_name = "exploration"
novel = true

# ---------------------------------------------------------------------------------------------
# [outcomes]: over the flat fields the shared driver writes when the negative's unit is complete. First match wins, in this order.
# g_negative_passed is: the harness exited nonzero AND reclaim_ok_stock_capped_1440 is among its failing keys, from a valid harness stamp
# whose result carries no error finding. measurement_valid is the conjunction of: no error finding in the unit, a valid harness stamp, a
# harness result with no error finding, the harness did not time out, and the result check control_sized_passes = true. A harness timeout
# is nonzero but names no key, so it never passes and lands in `invalid`.
# ---------------------------------------------------------------------------------------------

[outcomes.invalid]
condition = "all_units_complete = true AND measurement_valid = false"
decision = "INVALID: the unit carries an error finding, the harness timed out or left no valid stamp, the harness result carries an error finding (a rect missing or not numeric, the stock node not carrying the 420 / 480 px limits, the split not even 0.5 / 0.5, or the control failing reclaim_ok), or control_sized_passes is not true. Fix the driver or the environment, commit, and re-run under this sidecar's design; cite no sensitivity verdict from this run."
reasoning = "A verdict that could be an instrument bug is never reported without a valid measurement (BATHOS.md)."
is_residual = true

[outcomes.g_detected]
condition = "all_units_complete = true AND measurement_valid = true AND g_negative_passed = true"
decision = "AC-N6 passes: on a stock split carrying the deck's limits, K3's predicate reclaim_ok(.., 480) FAILED (g_harness_exit nonzero, reclaim_ok_stock_capped_1440 among g_failing_keys) and the same widget sized by the harness passed it (control_sized_passes). Cite this run id with the observed numbers from units/g.json and the harness result (stock real dead space, deck width, notebook width, sizes) in the T11 epic edit (AC-39 (f)). The recorded exploratory figures (73.5 px) are cited only as the prior, never as this run's result."
reasoning = "The stock arrangement was a valid even split carrying the deck's limits, the control proved the predicate can pass, and the predicate still failed: it sees the strip."
is_residual = false

[outcomes.g_not_detected]
condition = "all_units_complete = true AND measurement_valid = true AND g_negative_passed = false"
decision = "AC-N6 FAILS as a prediction: on a valid stock arrangement carrying the deck's limits K3's predicate PASSED (g_harness_exit, g_failing_keys, g_expected_key_failed in result.json), i.e. Lumino left no empty strip there. That contradicts assumptions A5 and A7 of the spec (the strip comes from Lumino's allocation honouring a minimum but not a maximum) and the recorded K2 run: it is a finding about Lumino or about the build under test, NOT a pass. Do not merge the increment on K3 alone: re-read the stock snapshot (stock_measures, stock_sizes, computed in the harness result), find what differs from the recorded arrangement, and re-register."
reasoning = "The measurement was valid and the control passed, so the predicate not failing is a real result about the arrangement, not an instrument fault."
is_residual = false

[result_schema]
all_units_complete = "bool"
n_negatives = "int"
n_error_units = "int"
measurement_valid = "bool"
g_harness_exit = "int"
g_expected_key_failed = "bool"
g_detected = "bool"
g_failing_keys = "str"
g_negative_passed = "bool"

# ---------------------------------------------------------------------------------------------
# D17 design statement: pre-registered here, committed before the first run.
# ---------------------------------------------------------------------------------------------

[design]
spec = ".praxia/docs/specs/261001_nd-next-5656-deck-layout.md AC-N6 and task T7 (N5656-8, A5, A7, A8, A31); epic 260929_notebook-display-epic.md D16, D17 (AC-39 sensitivity runs are pre-registered too)"
driver = "scripts/negatives/261001_nd_sensitivity_5656.py (argparse + logging; loads the shared AC-39 driver scripts/negatives/260929_nd_sensitivity.py by path and registers negative g in the LOADED module's table, so the shared file, a hashed input of the locked sprint A, B and C runs, is not edited), launched through scripts/spikes/261001_nd_sensitivity_5656.py (this sidecar's script); loads scripts/repl_smoke.py and scripts/unit_runner.py by path"
driver_unit_runner = "scripts/unit_runner.py: the negative unit and the harness unit it starts are started and killed through unit_runner.run_unit / kill_tree / Watchdog; nothing else in the driver starts or kills a process"
unit_list = ["g"]
statement = "One unit, g. The driver starts it as its own subprocess (python scripts/negatives/261001_nd_sensitivity_5656.py --unit g --out-dir <dir> --dist <pristine> --neg-root <root> --base-path <bp> --source-root <tree> --chrome-path <path>) through unit_runner.run_unit with timeout = its unit timeout + 60 s (see [design.timeouts]). The unit calls unit_runner.ensure_token(), arms a unit_runner.Watchdog at its unit timeout as its first act, then deletes its own stamp, artifact and timeout marker. It copies the PRISTINE dist to /tmp/claude-1000/nd-neg/g/dist/ (a fresh copy every time; nothing outside that directory is ever written or deleted), applies no mutation (the stock arrangement is built inside the harness unit), asserts the copy's dist_hash equals the pristine hash, deletes the harness unit's own earlier files under /tmp/claude-1000/nd-neg/g/out/, and runs ONLY its own harness unit (repl_smoke.py --dock-check --scenario N-g --serve-dir /tmp/claude-1000/nd-neg/g/dist --out-dir /tmp/claude-1000/nd-neg/g/out --base-path /praxis/ --chrome-path <path>) as a subprocess through unit_runner.run_unit with timeout = the harness unit's D16 budget (6 min) + 60 s (the harness's own --scenario watchdog fires at the budget). It reads the harness stamp: valid only if it exists, its inputs equal the inputs the copy implies and its result_sha256 matches the result on disk; the stamp governs even if run_unit timed out over it (logged with logging.warning); a harness unit with no stamp is a timeout (harness_exit 124) and names no key. The unit writes <out>/units/g.json with unit_runner.write_atomic under the watchdog lock, runs the bounded teardown (kill_tree over residual descendants, output flushed), commits <out>/units/g.stamp.json last through Watchdog.commit, and then calls only os._exit(stamp.exit). There is no whole-run timeout. The driver writes its flat fields to $BTH_RESULTS_PATH (and so bathos evaluates [outcomes]) only when the unit is complete, reused or recomputed; an incomplete unit writes no outcome and exits 3. Records go to outputs/nd_sensitivity/sprint_5656."
stamp = "{unit, inputs: {name: sha256}, artifact_sha256, started, finished, exit, timeout_s}; exit is 0 only if the driver code did not raise and every pre-registered field is present (a MISSED negative, outcome false, is still exit 0: it is a finding, not a crash)."
hashed_inputs = ["script (the shared driver scripts/negatives/260929_nd_sensitivity.py)", "entry (this run's driver scripts/negatives/261001_nd_sensitivity_5656.py, which defines negative g)", "runner (scripts/unit_runner.py)", "harness (scripts/repl_smoke.py, loaded by path; it holds the N-g unit and K3's predicate)", "dist_pristine (unit_runner.dist_hash of the pristine dist)", "dist_mutated (equal to dist_pristine: g mutates nothing)", "chrome (resolved path + chrome --version)", "driver (unit_runner.driver_input: Playwright version + uv.lock sha256)", "args (negative, harness unit and flag, mutation target none, base path, negative root, kind)"]
resume_rule = "--resume skips the negative only if its stamp exists, stamp.exit == 0, stamp.inputs equal the current inputs, stamp.artifact_sha256 equals the sha256 of the artifact on disk, the artifact has no error finding, every pre-registered field is present, and its recorded outcome passed (g_detected). Anything else is recomputed: g_not_detected (outcome false) is always rerun, so a contradicting result is never silently reused."
completeness = "The unit is complete when its artifact and a matching stamp (inputs equal the current inputs, artifact_sha256 equal to the artifact on disk) exist. A driver that raises is caught, recorded in the artifact as an error finding {type, message, traceback_tail <= 4 KiB} with harness_exit null, failing_keys [] and outcome false, and the unit still writes its artifact and stamp: it is complete, counts as a failed outcome (measurement_valid false, so `invalid`) and is never reused. Only a timeout (exit 124, no stamp, no artifact, a timeout marker) or a stampless crash makes the unit incomplete."
teardown_order = "1 write artifact through Watchdog.write_result; 2 kill_tree over residual descendants of the unit (it holds no browser: the harness unit closed its own); 3 flush stdout/stderr/logging; 4 Watchdog.commit(stamp); then only os._exit(stamp.exit). A hang in 1-3 is a timeout."
reads = "The outcome is read from the harness unit's stamp (exit) and result file (failing_keys, error, control_sized_passes), written by repl_smoke.py's run_scenario; never from printed console text."
persisted_units = "The negative is one unit (preemption: its stamp and artifact are written as soon as it completes; a timeout loses only this unit). Nothing else is long-running."

[design.timeouts]
whole_run_timeout = "none"
note = "D16 budget of N-g: 6 min (estimate, not a measurement: N-d, the same shape, is 6 min); the harness run_unit timeout is the budget + 60 s; the negative unit adds an estimated 180 s for copying and hashing the dist and teardown; the driver kills a unit at its timeout + 60 s. The first real run records wall times in result.json."

[design.timeouts.harness_unit_s]
g = 360

[design.timeouts.negative_unit_s]
g = 600

[design.timeouts.driver_kill_s]
g = 660

[design.units.g]
timeout_s = 600
harness_flag = "--dock-check"
harness_unit = "N-g"
expected_key = "reclaim_ok_stock_capped_1440"
required_fields = ["harness_exit", "failing_keys", "outcome"]
mutation = "none to /tmp/claude-1000/nd-neg/g/dist/ (a whole copy of the pristine dist is served with its own --out-dir /tmp/claude-1000/nd-neg/g/out/); the arrangement under test is built inside the harness unit: a stock split-right widget with inline min-width 420 px and max-width 480 px, added with shell.add(widget, 'main', {mode: 'split-right', ref}) and parent.fit(), no dock.js sizing, no dock() cell, no kernel"
description = "outcome is true iff the harness stamp is valid, harness_exit is nonzero, reclaim_ok_stock_capped_1440 is among failing_keys (present in the harness result and not holding; an absent key of a scenario that raised does not count) and the harness result carries no error finding. A harness timeout (exit 124, no stamp, and no result file because the watchdog deletes it under the lock) is nonzero but names no key, so it never passes. A measurement that fails any validity check raises inside the unit (an error finding): never a detection."

[design.validity]
inputs_not_outputs = "The checks read what was built and what the control did, never the dead-space number being judged: ng_measurement_problem requires (1) rects dock_panel, notebook_panel and deck_panel present and numeric in the stock and in the sized_control snapshot and the measured left inset in [0, 20] px, (2) computed min-width 420px and max-width 480px on the stock node, (3) the stock layout config holding two split sizes of 0.5 +- 0.01, and (4) reclaim_ok(sized_control, 480) true. Any failure raises DockCheckError inside the harness unit."
harness_negatives = "no error finding in the unit; a valid harness stamp; a harness result with no error finding; pristine_has_target and mutated_lacks_target (g has no target, so both are true by construction); the harness did not time out (exit 124); the result check control_sized_passes = true"
any_negative_invalid = "measurement_valid makes the whole run `invalid` and no verdict is cited from it"

[design.controls]
negative = "This run: K3's predicate must FAIL on the stock arrangement (the unit exits nonzero naming reclaim_ok_stock_capped_1440). Plumbing negative controls (web-repl/tests/test_nd_sensitivity_5656_driver.py): a stub harness that passes (the predicate did not fail), one that fails a different key, one whose control cannot pass, and one whose scenario raised must each NOT pass the negative's outcome; derive_ng_keys must reject missing rects, a 0.3 / 0.7 config, wrong computed limits and a control that fails reclaim_ok."
positive = "Inside the unit: the same widget sized by the harness itself passes reclaim_ok(.., 480). Plumbing positive controls: a stub harness that fails naming the expected key passes the negative; derive_ng_keys is true-detected on the recorded 1440 stock arrangement (K2 geo_before) and not-detected on a sized one."
plumbing = "web-repl/tests/test_nd_sensitivity_5656_driver.py exercises the N-g derivation, the registration of negative g without editing the locked shared driver (its sha256 is pinned) and the probe against a stub harness runner, with no browser."
