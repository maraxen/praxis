# ---------------------------------------------------------------------------------------
# D17 design statement: pre-registered here, committed before the first run.
# ---------------------------------------------------------------------------------------
[design]
spec = ".praxia/docs/specs/260929_notebook-display-epic.md D1 (S2 row), D2, D16, D17, AC-2, AC-42"
driver = "scripts/spikes/260929_s2_sanitizer.py (argparse + logging); shared runner scripts/unit_runner.py; launch pattern and ServedDir/chromium_launch_args/resolve_chrome_path/_open_existing_notebook from scripts/repl_smoke.py, loaded by path. Self-contained: it shares no code with the S1 driver."
unit_list = ["live", "crafted", "executed_saved_reopened", "neg_script_onclick"]
statement = "Each unit runs in its own subprocess (<script> --unit <name> --out-dir <dir>) and its own browser context, started by the driver through unit_runner.run_unit with timeout = 5 min + 60 s, and self-bounded by a unit_runner.Watchdog armed at 5 min as its first act after ensure_token(). The unit then deletes its own stamp, artifact and timeout marker, probes, writes <out>/units/<name>.json with unit_runner.write_atomic under the watchdog lock, runs the bounded teardown (browser and Playwright closed, kill_tree over residual descendants, output flushed), commits <out>/units/<name>.stamp.json last through Watchdog.commit, and then calls only os._exit(stamp.exit). There is no whole-run timeout. Outcomes are evaluated over the FULL unit set regardless of reuse: the driver writes its result (and so bathos evaluates [outcomes]) only when all four units are complete, reused or recomputed; a run with an incomplete unit writes no outcome and exits 3. A run whose units are all complete exits 0 even if the outcome is invalid."
stamp = "{unit, inputs: {name: sha256}, artifact_sha256, started, finished, exit, timeout_s}; exit is 0 only if the probe did not raise and every pre-registered field is present."
hashed_inputs = ["script (this driver)", "runner (scripts/unit_runner.py)", "harness (scripts/repl_smoke.py, loaded by path by the driver and the --unit branch)", "dist (unit_runner.dist_hash of the served dist)", "fixture (sha256 of the canonical JSON of the four authored notebooks and the carrier table; conservative: any change recomputes every unit)", "chrome (resolved path + chrome --version; headless_shell is refused)", "driver (unit_runner.driver_input: Playwright version + uv.lock sha256)", "args (unit, viewport 1440x900, base path; an addition to the D17 list, strictly more conservative)"]
upstream_inputs = "none: no S2 unit builds on another unit's result (D17: only a unit that builds on another's result hashes that unit's artifact_sha256), so no upstream:* input exists. The units are combined only by the outcome."
resume_rule = "--resume skips a unit only if its stamp exists, stamp.exit == 0, stamp.inputs equal the current inputs, stamp.artifact_sha256 equals the sha256 of the artifact on disk, the artifact has no error finding, and every field pre-registered for that unit (below) is present. Anything else is recomputed."
completeness = "A unit is complete when its artifact and a matching stamp (inputs equal the current inputs, artifact_sha256 equal to the artifact on disk) exist. A probe that raises is caught, recorded in the artifact as an error finding {type, message, traceback_tail <= 4 KiB}, and the unit still writes its artifact and stamp: it is complete, the error counts toward [outcomes] (an error never satisfies a positive outcome: measurement_valid is false and the outcome is `invalid`; a negative control that errors has NOT failed as required), and it is never reused. Only a timeout (exit 124, no stamp, no artifact, a timeout marker) or a stampless crash makes a unit incomplete. If the driver's run_unit times out over a valid stamp, the stamp governs and the driver logs a warning."
outcomes_over = "Outcomes are evaluated over the full unit set (all four units, reused or recomputed) regardless of reuse; reuse changes how the work is scheduled, never the [outcomes] criteria. The research note lists every unit as recomputed or reused with source path, input sha256s and artifact sha256."
teardown_order = "1 write artifact; 2 close browser and Playwright (errors logged, keys unchanged); 3 kill_tree over residual descendants; 4 flush stdout/stderr/logging; 5 Watchdog.commit(stamp); then only os._exit(stamp.exit). A hang in 1-4 is a timeout."
reads = "Every result is read from the notebook model (cell model, output model, contents API) and the rendered DOM via page.evaluate, never from printed console text. In-page API names had never met a real JupyterLab when this probe was written: an unreadable or uncontrolled read is null and then invalid, never a branch claim."
browser = "Full Chromium resolved by repl_smoke.resolve_chrome_path (never headless_shell), 1440x900."
kernel_dependency = "live and executed_saved_reopened need the dist's Pyodide kernel to run IPython.display; the probe never imports PLR. Sprint A's local run serves a dist built with the submodule initialised at the pin (D16, C11-3); a run against another dist is recorded as a deviation in the research note, as S1 did."
fixture = "Authored in the driver (build_main_html, build_neg_html, crafted_notebook, neg_notebook, live_notebook, exec_notebook). One carrier element per tag, located by tag name alone; every D1 element and attribute appears; data-* is tested as data-praxis-res and data-praxis-grid (the two names D14 uses); a sentinel span (id s2-sentinel, text S2-SENTINEL) carries an onclick attribute and is the trust corroborator; the bundle carries both text/html and text/plain."
real_run_command = "bth run --project-slug praxis --output-paths outputs/spikes/260929_s2 -- uv run --no-sync python3 scripts/spikes/260929_s2_sanitizer.py --out-dir outputs/spikes/260929_s2 --dist <dist>"
plumbing = "web-repl/tests/test_s2_spike_driver.py exercises driver, unit, stamp, resume, completeness and outcome gating against stub probes with no browser, the derivations against synthetic reads with a positive and a negative control, the sidecar's outcome partition, and (when bun and jsdom resolve) the in-page reader over a real DOM"

[design.timeouts]
unit_s = 300
driver_kill_s = 360
whole_run_timeout = "none"
note = "D17 S2 row: 5 min each; estimates from the spec, not measurements. Per-step waits inside a unit (navigation 60 s, kernel 100 s, other steps 30 s) are shorter than the budget so a stalled step is an error finding (a complete unit), not a timeout."

[design.fact_keys]
keys = ["rendered", "chosen_mime", "trust_state", "trust_corroborated", "corroboration", "trust_reads", "corroborator_onclick", "tags_present", "attrs", "svg_state", "svg_drawing_ok", "svg_class_all", "svg_style_all", "svg_role_all", "svg_aria_all", "svg_data_all", "svg_tabindex_all", "html_class_all", "html_style_all", "html_data_all", "html_tabindex_all", "html_text_ok", "plain_text_ok", "interaction_data_star", "interaction_tabindex", "all_present_intact"]
note = "Every key is present in every path unit's facts; null means unmeasured (never false)."

[design.authored]
elements = ["svg", "g", "path", "rect", "text", "title", "table", "details", "summary"]
d1_attributes = ["fill", "stroke", "stroke-width", "stroke-dasharray", "class", "style", "role", "aria-label", "tabindex", "data-*", "viewBox"]
data_attribute_names = ["data-praxis-res", "data-praxis-grid"]
geometry_attributes = ["d", "x", "y", "width", "height"]
drawing_attributes = ["viewBox", "fill", "stroke", "stroke-width", "stroke-dasharray", "d", "x", "y", "width", "height"]
style_declarations = ["fill:#2266aa", "stroke-width:3px", "min-width:120px"]
svg_family = ["svg", "g", "path", "rect", "text", "title"]
svg_drawing_family = ["svg", "g", "path", "rect", "text"]
html_family = ["table", "details", "summary"]

[design.derivations]
element_present = "the first element of that tag in the rendered output node, in the right namespace (SVG namespace for the svg family, XHTML for the html family); a stripped-tag child that survives as an unknown HTML element is NOT present"
attribute_survived = "present (name compared case-insensitively) with exactly the authored value; style: present with every authored declaration property kept (fill, stroke-width, min-width); present with a different value is altered, not survived"
svg_state = "full: svg, g, path, rect, text and title all present; absent: none of the six present; partial: anything else (including the svg element with a child stripped, or a child present without the svg element)"
svg_drawing_ok = "svg_state full AND every authored drawing attribute (viewBox, fill, stroke, stroke-width, stroke-dasharray, d, x, y, width, height) survived on every carrier that authored it (svg g path rect text)"
svg_class_all_and_style_all = "class (resp. style) survived on ALL five drawing carriers svg, g, path, rect, text; a conservative reading of D1's 'class and/or style stripped' (S2-A needs both intact everywhere; A-prime is any loss)"
interaction = "crafted_data_star_survives and crafted_tabindex_survives: both data-* names (resp. tabindex) survived on all svg drawing carriers when svg_state is full, else on table, details and summary"
trust_state = "the output model's trusted (outputs.get(0).trusted), reported only when CORROBORATED: the cell model's trusted, when readable, agrees, AND either (onclick) the corroborator element's onclick attribute survived exactly when the output is trusted, or (plain_choice, only when text/plain was chosen and no HTML exists) the model says untrusted and no rendered node has the jp-mod-trusted class. Otherwise null."
chosen_mime = "the data-mime-type of the first .jp-OutputArea-output node in the cell (fallback: the first data-mime-type node under .jp-OutputArea)"
crafted_branch = "null unless rendered, trust corroborated and the mimetype read. Trusted: crafted-trusted. Untrusted: text/plain -> S2-C (if the plain summary text is visible, else S2-unmapped); another mimetype -> S2-unmapped; text/html -> svg_state absent -> S2-B if table, details and summary are present, else S2-unmapped; full -> S2-unmapped unless svg_drawing_ok, then S2-A if class and style survive on all five carriers, else S2-A-prime (D1's S2-A'); partial -> S2-unmapped"
exec_branch = "the same rule on the executed-saved-reopened facts, with a trusted result being S2-T"
paths_consistent = "exec_branch is S2-T, or equals crafted_branch (both untrusted, same sanitizer); null on either side is inconsistent"
negative_control_failed_as_required = "rendered as text/html with both marker elements, corroborated untrusted, script element count 0 and no onclick attribute (see [design.units.neg_script_onclick])"
validity_checks = "no_error_findings, all_rendered, trust_corroborated_all, live_executed_ok, live_trusted, live_positive_control_ok, crafted_file_ok, neg_file_ok, crafted_neg_trust_agree, crafted_neg_mime_agree, neg_consistent_with_trust (trust false: script and onclick stripped, or a text/plain render; trust true: neither stripped), exec_executed_and_saved, reopen_paths_agree, crafted_branch_measured, exec_branch_measured, paths_consistent"
measurement_valid = "the conjunction of validity_checks"
survivorship_table = "result.json (details.survivorship) carries the AC-2 table: element presence and per-element attribute survived flags for trusted live, untrusted reopened (crafted) and executed-saved-reopened"

[design.controls]
positive = "the live unit: a trusted live render must show every authored element and attribute intact and the negative bundle's <script> and onclick visible (live_positive_control_ok). The crafted-file readback and the saved-file readback prove the notebook on the drive is what was authored, and that the executed one was saved with its output."
negative = "neg_script_onclick: a <script> element and an onclick attribute must be observed STRIPPED from an untrusted render whose marker elements are present. A negative control that errors has NOT failed as required."
corroboration = "trust is never taken from one read: the output-model read, the cell-model read and the surviving-onclick corroborator must agree, else trust is null and the run is invalid"
plumbing_positive_negative = "web-repl/tests/test_s2_spike_driver.py runs both: a synthetic fully-intact trusted render passes the live positive control and a stripped or uncorroborated one fails it; a sanitized render passes the negative control and one whose script survived while the model said untrusted fails it"

[design.units.live]
timeout_s = 300
upstream = []
required_fields = ["path", "kernel_ready", "executed_ok", "reads", "facts", "neg_bundle_live", "positive_control_ok", "reason"]
description = "Seed a two-cell notebook (cell 0 displays the main bundle, cell 1 the negative bundle, each as a raw mimebundle through IPython.display in the Pyodide kernel), open it, wait for the kernel to be idle, run each cell (dispatched, never awaited) and read the rendered output from the DOM and the models. The output is TRUSTED (displayed live). positive_control_ok iff: rendered as text/html, trust corroborated True, every authored element present in its namespace and every authored attribute present and intact on every carrier (style: every declared property kept), the svg family complete, the sentinel onclick kept, and the negative bundle's <script> element and onclick attribute both visible (script_present, onclick_present). This is the instrument's positive control: it can only pass if the fixture and the reader see the whole bundle."

[design.units.crafted]
timeout_s = 300
upstream = []
required_fields = ["path", "file_readback", "file_ok", "read", "facts", "reason"]
description = "Write the crafted notebook JSON (one code cell, execution_count null, no trusted metadata anywhere, one display_data output with text/html and text/plain) to the drive with contents.save, read it back from the drive (file_readback: one output, both mimetypes at the authored length, never executed, no trusted flag; file_ok), open it with docmanager:open (Select Kernel dialog accepted), never run a cell, wait for the output to render and read output 0 from the DOM and models. Records the trust state (corroborated), the chosen mimetype and the per-element and per-attribute survivorship (the AC-2 untrusted-reopened column) and the crafted branch."

[design.units.executed_saved_reopened]
timeout_s = 300
upstream = []
required_fields = ["path", "kernel_ready", "executed_ok", "live_read", "live_trust_before_save", "save_method", "saved_file", "saved_file_ok", "close_ok", "reopen_close", "reload_reopen_method", "reopen_reload", "facts_close", "facts_reload", "reopen_agree", "facts", "reason"]
description = "Seed the exec notebook, open it, wait for the kernel, run cell 0 (raw mimebundle display) and read the LIVE output (live_trust_before_save). Save through the document context (then the docmanager:save command if the file on the drive still lacks the output), verified by reading the FILE (saved_file_ok: display_data output with both mimetypes, an execution count). Close the panel (close_ok). Reopen 1: docmanager:open in the same page, read output 0 (reopen_close). Reopen 2: full page reload, then open from the drive (or reveal, if the workspace restored it; reload_reopen_method), read output 0 (reopen_reload). facts is the reload read; reopen_agree iff trust is corroborated and equal in both reads and both reads agree on the chosen mimetype and every survivorship rollup, else the merged trust state is null (invalid). Trust state and mimetype of this path give exec_trusted (S2-T if true) and exec_branch."

[design.units.neg_script_onclick]
timeout_s = 300
upstream = []
required_fields = ["path", "file_readback", "file_ok", "read", "facts", "neg", "negative_control_failed_as_required", "reason"]
description = "Negative control. Its own crafted notebook (never executed) holds a display_data output whose text/html has a <script> element, an element with an onclick attribute and two marker elements, and a text/plain. Written, read back from the drive, opened and read like the crafted unit. negative_control_failed_as_required iff: rendered as text/html, both marker elements present (so stripped cannot mean not rendered), trust corroborated UNTRUSTED, the <script> element count is 0 and no element carries onclick. A control that errors, or that saw an unrendered or uncorroborated output, has NOT failed as required. A text/plain render (S2-C) shows no HTML, so the control is vacuous there (failed_as_required false) and only its consistency is required."
