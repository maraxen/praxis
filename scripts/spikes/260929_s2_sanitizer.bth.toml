# The residual: the instrument did not produce a valid measurement. Not evidence for any branch.
[outcomes.invalid]
condition = "all_units_complete = true AND measurement_valid = false"
decision = "INVALID: at least one unit carries an error finding, an output never rendered, trust could not be read and corroborated, the live positive control did not see the whole bundle, the negative control did not behave as required (including a negative control that errored, which has NOT failed as required), the two reopen reads disagree, or the paths are inconsistent. Fix the probe, commit, and re-run under this sidecar's design; cite no branch from this run."
reasoning = "A verdict that could be a probe bug is never reported without a control that proves the instrument can say the opposite. In-page API names in this probe had never met a real JupyterLab when it was pre-registered, so an unreadable measurement is null and then invalid, never a branch."
is_residual = true

