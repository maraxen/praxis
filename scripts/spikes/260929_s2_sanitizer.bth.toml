# Pre-registration sidecar for spike S2 (task 260929_notebook-display-design, backlog #5624 = A2,
# epic #5648). Spec: .praxia/docs/specs/260929_notebook-display-epic.md, D1 row S2, D2 (the
# mimebundle), D16 (shared unit runner, bounded teardown), D17 (units, resume, completeness),
# AC-2, AC-42.
#
# THIS FILE AND scripts/spikes/260929_s2_sanitizer.py ARE COMMITTED BEFORE ANY RUN. No browser
# has been launched against this probe, no dist has been built for it, and `bth run` has not
# been invoked when this file was written: the outcome criteria below were chosen from the
# spec, not from numbers. Run it with `bth`, never `uv run bth` (which silently skips sidecar
# enforcement). `bth run` has NO `--out` option; the driver reads $BTH_RESULTS_PATH:
#
#   bth run --project-slug praxis --output-paths outputs/spikes/260929_s2 -- \
#     uv run --no-sync python3 scripts/spikes/260929_s2_sanitizer.py \
#       --out-dir outputs/spikes/260929_s2 --dist <dist> [--resume]
#
# Verify the run by its RECORD (bth compact first if it is not visible yet):
#   bth sql "SELECT id, status, outcome, exit_code, command FROM runs WHERE id LIKE '<prefix>%'"
#
# The driver writes the flat fields below to $BTH_RESULTS_PATH ONLY when every unit is
# complete. An incomplete run (a timeout, a stampless crash) exits 3 and writes no result, so
# bathos records no outcome, and the next `--resume` run is a new run record. A run whose four
# units are complete exits 0 even when the outcome is `invalid`.
#
# Needs FULL Chromium (never headless_shell; the driver refuses it) and a dist. `live` and
# `executed_saved_reopened` run two IPython.display cells in the dist's Pyodide kernel (the
# probe never imports PLR; a dist whose kernel bootstrap fails delays or blocks those two
# units). `crafted` and `neg_script_onclick` never run a cell.
[experiment]
hypothesis = "In the praxis JupyterLite lab build (JupyterLab's own rendermime and sanitizer, no labextension), for a notebook reopened UNTRUSTED, JupyterLab chooses a mimetype from {text/html, text/plain} for a bundle that carries both, and its sanitizer keeps some subset of our HTML and SVG. The spike authors one text/html fragment containing every element (svg g path rect text title details summary table) and every attribute (fill stroke stroke-width stroke-dasharray class style role aria-label tabindex data-* and viewBox, plus the geometry attributes d x y width height) named in D1's S2 row, and measures, per reopen path, the trust state, the chosen mimetype and what survives. Two reopen paths are probed: (1) CRAFTED, a notebook JSON written to the drive and never executed (untrusted by construction; stands for download/upload), and (2) EXECUTED-SAVED-REOPENED, a notebook executed in the browser, saved, closed and reopened, then reloaded and reopened again, whose trust state is recorded (S2-T if trusted on both reopens). The live path (trusted, displayed by the kernel) is the positive control: every authored element and attribute must be visible and intact. The negative control is its own crafted notebook holding a <script> element and an onclick attribute, which must be observed STRIPPED, proving the sanitizer ran. The prior is unknown and is NOT a criterion: every D1 branch, and two non-branch findings (crafted-trusted, S2-unmapped), are pre-registered outcomes, and the run is only INVALID (residual) if the instrument itself failed (an error finding, an unrendered output, trust that could not be read and corroborated, a control that did not behave as required, a reopen pair that disagrees, or inconsistent paths)."
stage_name = "exploration"
novel = true

# ---------------------------------------------------------------------------------------
# [outcomes]: one outcome per D1 S2 branch of the CRAFTED path, split by whether the
# executed-saved-reopened path reopened trusted (S2-T, D1: "the branches below then apply only
# to the crafted path"), plus the two non-branch findings and the residual. All conditions read
# the flat fields the driver writes when all four units are complete. Labels: crafted_branch is
# one of S2-A, S2-A-prime (D1's S2-A'), S2-B, S2-C, S2-unmapped (not a D1 branch), crafted-trusted
# (not a D1 branch), or null. measurement_valid is the conjunction of the named validity checks in
# [design.derivations]; any error finding, anywhere, therefore lands in `invalid`: an error never
# satisfies a positive outcome.
# ---------------------------------------------------------------------------------------
[outcomes.s2_a_exec_t]
condition = "all_units_complete = true AND measurement_valid = true AND negative_control_failed_as_required = true AND crafted_branch = 'S2-A' AND exec_trusted = true"
decision = "S2-A: text/html is chosen for the untrusted crafted notebook and the SVG survives with class and style intact on every SVG element. Full design, with token-mapped CSS (D3) applied to reopened outputs. Executed-saved-reopened path: S2-T. It reopened TRUSTED (corroborated on both reopens), so it renders as live and the branch above applies only to the crafted path (D1)."
reasoning = "Crafted path: S2-A. measurement_valid already requires the corroborated trust reads, the live positive control, the crafted/negative-control agreement and the negative control's consistency; see [design.derivations]."
is_residual = false

