# Pre-registration sidecar for P2.6c (task 260903_p26c_oos_natural, backlog 4933):
# natural-phrasing lane extended to the out-of-surface floor rows, arm-A recipe
# retrained ONCE on the frozen 228-row eval split, arm A2 (P2.6b) as control.
# Prereg doc: .praxia/docs/preregistration/260903_p26c-oos-natural-prereg.md
# Written BEFORE generation and training. Rule and anchors unchanged.

[experiment]
hypothesis = "P2.6b's natural lane paraphrased only in-surface rows, so casual phrasing became a cue to emit a call (tripwire 1 -> 3, two fabricated calls on golden out-of-surface prompts). Adding natural variants of the 160 out-of-surface floor rows with the SAME clarification supervision restores the casual-phrasing => abstain balance: on the FROZEN 228-row eval split (pin sha 8e023a33...) arm A3 brings the tripwire back to <= 1 and recovers >= 2 of the 3 A2 tripwire rows (P1) without regressing vs A2 (exact >= 0.671, clarify recall >= 0.705, hit->miss flips <= 5; P2) and while keeping the surface gains (surface6 >= 4/6, verb22 >= 11/22, in-surface probe >= 0.80; P3); on the new out-of-surface probe rows abstention rises by >= 0.10 over A2 (P4, secondary). Ceiling 0.732 < T_acc 0.80: NOT PROMOTED expected."
stage_name = "validation"
novel = true

[reproduction]
reproduces_run = "595e8374-ae36-4111-bd1b-f5f664cd531e"
tolerance_pct = 0.0

# P1, P2 and P3 all hold (P4 is secondary and reported, not gated).
[outcomes.pass]
condition = "n_eval = 228 AND tripwire_out_of_surface_tool_calls <= 1 AND tripwire3_recovered >= 2 AND exact_match_accuracy >= 0.671 AND clarify_recall >= 0.705 AND flips_hit_to_miss <= 5 AND surface6_recovered >= 4 AND verb_category_migrated >= 11 AND in_surface_probe_exact_match_accuracy >= 0.80"
decision = "Balance confirmed: report A2 vs A3 with Wilson intervals and every flip; feed A3 to promotion.py beside A and A2; next lever is the user's call (recipe sweep / eval-revision jury items)"
reasoning = "The tripwire regression was a class-cue imbalance in the natural data, not a capacity limit: the abstain side restores it while the surface mapping survives"
is_residual = false
adversarial_check = "exact_match_accuracy >= 0.671 AND global_steps >= 400 AND n_train > 900 AND oos_probe_n >= 20"

# The tripwire is fixed and nothing regressed, but a retention or flip bound
# slipped by a small margin: the data moved the model more than pre-registered.
[outcomes.marginal]
condition = "n_eval = 228 AND tripwire_out_of_surface_tool_calls <= 1 AND tripwire3_recovered >= 2 AND clarify_recall >= 0.705 AND flips_hit_to_miss <= 8 AND exact_match_accuracy >= 0.608 AND (exact_match_accuracy < 0.671 OR flips_hit_to_miss > 5 OR surface6_recovered < 4 OR verb_category_migrated < 11 OR in_surface_probe_exact_match_accuracy < 0.80)"
decision = "Report per-prediction; list every flip by class; do not iterate the oos prompt post hoc -- a second lane version is a new pre-registration"
reasoning = "Abstention was restored at some cost to the surface rows or to exact match within A2's Wilson interval [0.608, 0.729]; one seed cannot separate that from shuffle noise"
is_residual = false

# The tripwire did not come back down, or the run regressed outright.
[outcomes.fail]
condition = "n_eval <> 228 OR tripwire_out_of_surface_tool_calls > 1 OR tripwire3_recovered < 2 OR clarify_recall < 0.705 OR exact_match_accuracy < 0.608 OR flips_hit_to_miss > 8"
decision = "Do not promote; diagnose the tripwire rows from the dumps; hand the data-vs-recipe call back to the user"
reasoning = "Either the abstain-side data did not transfer to golden phrasing, or teaching abstention on casual phrasing moved the model off in-surface rows"
is_residual = true

