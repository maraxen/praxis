name: Deploy to GitHub Pages

# Publishes the static JupyterLite REPL built by web-repl/scripts/build_repl.py.
#
# This file previously built the pre-refocus architecture: generate_browser_db.py,
# `jupyter lite build` against praxis/web-client/jupyterlite-config.json, a
# git-checkout-four-files overlay, bun install, and an Angular build:gh-pages,
# publishing praxis/web-client/dist/web-client/browser. None of that is the
# current build, and the Angular embed was dropped by decision (execution plan
# P7.3's own "or skip entirely", open question Q8).

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # submodules: recursive is load-bearing -- build_wheels.py builds the
      # pylabrobot wheel via `git archive <sha>` against external/pylabrobot.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Assert the submodule is actually present
        run: test -f external/pylabrobot/pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # `uv sync`, not `uv pip install -e ".[dev]"`: playwright lives in
      # [dependency-groups] dev, not in the extras, and the gates below need it.
      - name: Install Python dependencies
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync

      - name: Cache vendored runtime
        uses: actions/cache@v4
        with:
          path: web-repl/vendor
          key: >-
            vendor-${{ runner.os }}-${{ hashFiles(
              'web-repl/jupyter_lite_config.json',
              'web-repl/vendored_wheels.json') }}

      # build_repl.py fetches the piplite wheels itself but REQUIRES the Pyodide
      # tarball to already be vendored -- it fails with "pyodide-<v>.tar.bz2 not
      # found" otherwise. The cache above only restores it; nothing populated it
      # on a cold run. On a cache hit this is a no-op: fetch_pyodide verifies the
      # tarball's sha256 and skips the ~430 MB download.
      - name: Vendor Pyodide
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/fetch_pyodide.py

      # build_repl.py orchestrates the site build but does NOT produce the wheels
      # it describes: build_manifest.py fails with "overlay/assets/wheels does not
      # exist" without this. The wheels are gitignored (R6/R8 -- zero tracked
      # .whl repo-wide), so a clean checkout has none.
      - name: Build the wheels
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/build_wheels.py

      # /praxis/ is the Pages project-site prefix (maraxen.github.io/praxis/).
      # Without it welcome.ipynb's HOST_ROOT stays "/" and every bootstrap fetch
      # 404s against the domain root -- a site that boots, opens the notebook, and
      # fails only on its first cell.
      - name: Build the REPL
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/build_repl.py --base-path /praxis/

      - name: Install Chromium
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run playwright install --with-deps chromium

      # Gate the ARTIFACT ABOUT TO BE PUBLISHED, not a parallel one. repl.yml also
      # runs on pushes to main, but it is a separate workflow: nothing stops this
      # job from publishing while that one goes red. Re-running the two decisive
      # gates here costs a few minutes and makes "deployed" mean "a browser opened
      # this exact build and ran the notebook".
      - name: Offline gate on the built artifact
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --probe --offline --base-path /praxis/

      - name: Execute welcome.ipynb on the built artifact
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --notebook-check --base-path /praxis/

      # .nojekyll is required, not cosmetic: dist/assets/shims/__init__.py starts
      # with an underscore, and Jekyll strips underscore-prefixed paths. Without
      # it the shims package silently does not ship.
      # 404.html backs deep links into the lab app.
      - name: SPA fix (.nojekyll + 404.html)
        run: |
          touch web-repl/dist/.nojekyll
          cp web-repl/dist/index.html web-repl/dist/404.html

      # NO coi-serviceworker.js. The old deploy curled it unpinned from
      # raw.githubusercontent.com into the published site. Measured 2026-08-20:
      # every non-COI probe reports crossOriginIsolated=false and the site still
      # boots fully -- kernel ready, GATE G6 passing, visualizer green. Pyodide
      # needs cross-origin isolation only for threading, which this build does not
      # use. Dropping it removes an unverified third-party fetch from the deployed
      # site; if a future change needs COI, add it back PINNED.

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # ~479 MB after build_repl.py prunes the 62 test-suite packages and stale
      # duplicate wheels (584 MB before). Comfortably inside Pages' 1 GB limit.
      # The remainder is the vendored Pyodide distribution, kept whole on purpose:
      # disablePyPIFallback is true, so a pruned package is unobtainable at
      # runtime rather than merely slow, and a protocol author reaching for scipy
      # or pandas is plausible. A boot downloads ~18 MB of it, not 479.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-repl/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
