name: REPL

# GATE G7. The execution plan's reason for this file existing, verbatim:
# "Nothing merges on a locally-green suite: this repo shipped an unservable build
# precisely because no CI gate looked at the browser."
#
# Every step below already exists as a script and has been observed FAILING as
# well as passing locally -- none of them is a check that has only ever been seen
# green.

on:
  push:
    branches: [main]
    # NOTE: duplicated deliberately. GitHub Actions does not support YAML
    # anchors/aliases in workflow files, so a &anchor here would either be
    # rejected or silently mis-parsed.
    paths:
      - 'web-repl/**'
      - 'coxswain/**'
      - 'scripts/repl_smoke.py'
      - 'external/pylabrobot'
      - '.github/workflows/repl.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'web-repl/**'
      - 'coxswain/**'
      - 'scripts/repl_smoke.py'
      - 'external/pylabrobot'
      - '.github/workflows/repl.yml'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: repl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repl:
    name: Build + browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      # submodules: recursive is LOAD-BEARING. build_wheels.py builds the
      # pylabrobot wheel with `git archive <sha>` against external/pylabrobot; a
      # bare checkout (which is what all five jobs in ci.yml use) fails deep
      # inside that script with a confusing git error instead of here.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Assert the submodule is actually present
        run: test -f external/pylabrobot/pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Inside the repo's 3.10-3.12 test matrix. Local dev is 3.14; scripts
          # must stay 3.10-compatible.
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # `uv sync`, NOT `uv pip install -e ".[dev]"` as ci.yml does: playwright is
      # declared in [dependency-groups] dev (pyproject.toml:299+), not in the
      # [project.optional-dependencies] dev extra, so the extras form installs a
      # tree with no playwright in it and every browser gate below fails to import.
      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync

      # ~430 MB Pyodide tarball + the pinned piplite wheels. Without this every
      # run re-downloads them. Keyed on the two files that pin what gets fetched:
      # jupyter_lite_config.json carries the Pyodide version, vendored_wheels.json
      # the wheel pins.
      - name: Cache vendored runtime
        uses: actions/cache@v4
        with:
          path: web-repl/vendor
          key: >-
            vendor-${{ runner.os }}-${{ hashFiles(
              'web-repl/jupyter_lite_config.json',
              'web-repl/vendored_wheels.json') }}

      # build_repl.py fetches the piplite wheels itself but REQUIRES the Pyodide
      # tarball to already be vendored -- it fails with "pyodide-<v>.tar.bz2 not
      # found" otherwise. The cache above only restores it; nothing populated it
      # on a cold run. On a cache hit this is a no-op: fetch_pyodide verifies the
      # tarball's sha256 and skips the ~430 MB download.
      - name: Vendor Pyodide
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/fetch_pyodide.py

      # build_repl.py orchestrates the site build but does NOT produce the wheels
      # it describes: build_manifest.py fails with "overlay/assets/wheels does not
      # exist" without this. The wheels are gitignored (R6/R8 -- zero tracked
      # .whl repo-wide), so a clean checkout has none.
      - name: Build the wheels
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/build_wheels.py

      - name: Install Chromium
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run playwright install --with-deps chromium

      # --base-path /praxis/ matches the Pages project-site URL
      # (https://maraxen.github.io/praxis/). It sets the served prefix only; nothing
      # in the build rewrites notebooks for it any more. The site root is derived at
      # runtime by praxis_boot.derive_host_root() from the kernel worker's own URL.
      - name: Build the site
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/build_repl.py --base-path /praxis/

      - name: Wheel coherence and contract
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/check_wheel_coherence.py --check-untracked
          uv run python web-repl/scripts/check_wheel_contract.py

      - name: Gesture invariant (no await/async before gesture calls, D6)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/check_gesture_invariant.py

      - name: Probe the kernel
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --probe --base-path /praxis/

      # GATE G5's offline clause. Blackholes cdn.jsdelivr.net, pypi.org and
      # files.pythonhosted.org at the Chromium resolver (NOT page.route(), which
      # does not intercept Web Worker requests -- and the kernel is a worker, so a
      # route()-based gate passes vacuously). The run self-tests that the
      # blackhole is really in force before trusting a green boot.
      - name: Offline gate
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --probe --offline --base-path /praxis/

      - name: Execute welcome.ipynb
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --notebook-check --base-path /praxis/

      # Every kernel sets PyLabRobot up automatically on startup via PYTHONSTARTUP
      # (web-repl/jupyter-lite.json -> web-repl/files/praxis_startup.py). This gate
      # proves a bare first cell gets a ready kernel with no setup code, that the gate
      # waits for setup to complete, and that playground names (LiquidHandler, STAR)
      # are available without imports. A 15s delay on the wheel fetch ensures the wait
      # is observed, not masked by fast setup. Covers AC-1 and AC-2.
      - name: Fresh kernel auto-setup (zero-action first cell)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --fresh-boot-check --base-path /praxis/

      - name: Auto-setup failure is visible in the cell (loader 404)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --autosetup-fault-check --fault 404:bootstrap/stages.py --base-path /praxis/

      - name: Auto-setup failure is visible in the cell (tampered loader)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --autosetup-fault-check --fault tamper:bootstrap/stages.py --base-path /praxis/

      - name: Auto-setup re-runs after a kernel restart
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --restart-check --base-path /praxis/

      # Completion has three tiers and they see different things. build_repl.py's
      # assert_completion_autocompletion already covered tier 1 (the setting reached
      # the runtime config) during the build step above. These two cover the rest:
      # the kernel half (is jedi resident, does it answer, how fast) and the browser
      # half (does the popup open from typing alone). Neither subsumes the other --
      # the config assertion passes on a build whose kernel cannot complete, and the
      # kernel probe passes on a build where the frontend setting never applied.
      # --max-completion-ms is deliberately NOT set yet. Cold completion measured
      # 415-543 ms on the dev box, and the ceiling that matters is the completer's
      # 1000 ms providerTimeout -- but a GitHub runner is slower than this box by an
      # unmeasured factor, so any threshold picked from local numbers is a guess that
      # fails as flake rather than as signal. The step logs the number; set the bound
      # once a few CI runs have established the runner's own baseline.
      - name: Completion — kernel (jedi resident, answers, latency)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --completion-check --require-jedi \
            --base-path /praxis/

      # Never presses Tab. Tab-completion worked before autoCompletion was enabled,
      # so a Tab-pressing gate would pass identically with the setting off and
      # assert nothing. Verified sensitive 2026-08-24: stripping settingsOverrides
      # from the built config makes this step fail.
      - name: Completion — as-you-type (no Tab pressed)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --typeahead-check --base-path /praxis/

      # Persistence (L1 storage.persist(), L2 FSA working folder, first-save gate, L3 download/upload)
      - name: Persistence — L1/L2/L3 end-to-end
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --persistence-check --base-path /praxis/

      # Not prefixed: --viz-check serves the vendored renderer tree directly, with
      # no JupyterLite app and no base path involved.
      - name: Visualizer render + praxis_viz channel
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python scripts/repl_smoke.py --viz-check

      # Branding is a build artifact, so it is verified against the built tree
      # rather than the sources: --check fails if the <head> block is absent,
      # the <title> still says JupyterLite, or a <link> points at a file that
      # is not actually on disk (a live 404 that renders as an unstyled page).
      - name: Branding + vendored font integrity
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python web-repl/scripts/inject_branding.py --check
          uv run python web-repl/scripts/vendor_fonts.py --check

      # One process per file, deliberately. These tests manipulate sys.path,
      # cache modules under synthetic names, and toggle PyLabRobot globals
      # (set_tip_tracking); sharing one interpreter invites order-dependent
      # failures that would be far harder to read than this list.
      - name: Tests
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv run python -m pytest web-repl/tests/test_autosetup_build_assertions.py -q
          uv run python -m pytest web-repl/tests/test_base_path.py -q
          uv run python -m pytest web-repl/tests/test_browser_visualizer.py -q
          uv run python -m pytest web-repl/tests/test_build_manifest.py -q
          uv run python -m pytest web-repl/tests/test_build_manifest_coxswain.py -q
          uv run python -m pytest web-repl/tests/test_check_gesture_invariant.py -q
          uv run python -m pytest web-repl/tests/test_check_wheel_coherence.py -q
          uv run python -m pytest web-repl/tests/test_contract_covers_imports.py -q
          uv run python -m pytest web-repl/tests/test_d1_praxis_git_sha.py -q
          uv run python -m pytest web-repl/tests/test_fetch_vendored_wheels.py -q
          uv run python -m pytest web-repl/tests/test_inject_branding.py -q
          uv run python -m pytest web-repl/tests/test_inject_shell_coxswain.py -q
          uv run python -m pytest web-repl/tests/test_persistence_staging.py -q
          uv run python -m pytest web-repl/tests/test_plr_contract.py -q
          uv run python -m pytest web-repl/tests/test_praxis_boot_autosetup.py -q
          uv run python -m pytest web-repl/tests/test_praxis_bootstrap_loader.py -q
          uv run python -m pytest web-repl/tests/test_praxis_startup.py -q
          uv run python -m pytest web-repl/tests/test_prune_pyodide.py -q
          uv run python -m pytest web-repl/tests/test_repl_workflow_covers_tests.py -q
          uv run python -m pytest web-repl/tests/test_rid_invariant.py -q
          uv run python -m pytest web-repl/tests/test_stamp_loader_shas.py -q
          uv run python -m pytest web-repl/tests/test_theme_staging.py -q
          uv run python -m pytest web-repl/tests/test_transport.py -q
          uv run python -m pytest web-repl/tests/test_viz_highlight_staging.py -q

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repl-failure-diagnostics
          # dist/ itself is ~584 MB and not worth uploading; these are the small
          # files that explain a failure.
          path: |
            web-repl/.dist-jupyterlite-build.log
            web-repl/dist/jupyter-lite.json
            web-repl/dist/api/contents/all.json
          if-no-files-found: ignore

  # Coxswain W1.0 (260824_coxswain-mvp-ux-spec.md). The root pyproject sets
  # testpaths = ["tests"], so ci.yml never collects coxswain/tests; this job
  # runs them via an explicit path argument, which overrides testpaths.
  # coxswain/pyproject.toml carries its own [tool.pytest.ini_options]
  # (--no-cov) so the root --cov addopts do not leak into this run.
  # `bun test web-repl/shell/coxswain` needs no package.json by design; the
  # harness under that directory was observed failing as well as passing
  # before it was depended on here (same rule as every gate above).
  coxswain:
    name: Coxswain pytest + JS harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      # submodules: recursive is LOAD-BEARING here too (see the repl job): the
      # root pyproject resolves `pylabrobot` as a path dependency on
      # external/pylabrobot, so even `uv run pytest coxswain/tests` fails in its
      # implicit env sync on a bare checkout ("does not appear to be a Python
      # project"). Observed failing exactly that way before this line landed.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # --all-packages, not a bare `uv run`: coxswain is a uv WORKSPACE MEMBER
      # but the root project does not depend on it, so the default sync installs
      # only the root env and `import coxswain` fails at collection
      # (ModuleNotFoundError). --all-packages installs every member; --no-sync
      # then keeps pytest from re-syncing the member back out.
      - name: Coxswain Python tests
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync --all-packages
          uv run --no-sync pytest coxswain/tests -q

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Coxswain JS harness
        run: bun test web-repl/shell/coxswain

      - name: Persistence JS harness
        run: bun test web-repl/shell/persistence
